App._morteEvitarResolver = async (fichaId)=>{
  const f = getFicha(fichaId);
  const dado = d(12);
  const nivel = Number(f.nivel)||1;
  let texto = `Dado de Esperança: ${dado}. `;
  let cicatriz = false;
  if(dado <= nivel){
    cicatriz = true;
    f.cicatrizes = (f.cicatrizes||0)+1;
    const novoMax = Math.max(0, 6-f.cicatrizes);
    if(f.esperanca > novoMax) f.esperanca = novoMax;
    texto += `Igual ou menor que o nível (${nivel}) — o personagem sofre uma cicatriz: uma casa de Esperança é riscada permanentemente.`;
    if(f.cicatrizes>=6) texto += ' Todas as casas de Esperança foram riscadas: é hora de encerrar a jornada deste personagem.';
  } else {
    texto += `Maior que o nível (${nivel}) — o personagem evita a cicatriz desta vez.`;
  }
  texto += ' O personagem fica inconsciente: não pode se mover, agir, ou ser alvo de ataques, até recuperar 1+ Ponto de Vida ou até o próximo descanso longo do grupo.';
  f.status = 'inconsciente';
  await salvarUmaFicha(f, true);
  state.movimentoMorte = { fichaId, fase:'resultado', texto, dadoGrande: dado, corDado: cicatriz?'var(--fear)':'var(--hope)' };
  render();
};
App.morteArriscarTudo = ()=>{
  const mm = state.movimentoMorte;
  state.movimentoMorte = { fichaId: mm.fichaId, fase:'rolando', rolandoTexto:'Rolando os Dados de Dualidade…' };
  render();
  setTimeout(()=> App._morteArriscarResolver(mm.fichaId), 1100);
};
App._morteArriscarResolver = async (fichaId)=>{
  const f = getFicha(fichaId);
  const esperanca = d(12), medo = d(12);
  let texto = `Esperança: ${esperanca} · Medo: ${medo}. `;
  if(esperanca===medo){
    f.pv = 0; f.pf = 0; f.status = 'vivo';
    await salvarUmaFicha(f, true);
    texto += 'Sucesso crítico! O personagem continua de pé, recupera todos os Pontos de Vida e zera a Fadiga.';
    state.movimentoMorte = { fichaId, fase:'resultado', texto, dadoGrande: esperanca, corDado:'var(--seal)' };
  } else if(esperanca>medo){
    texto += `A Esperança venceu — o personagem continua de pé. Distribua ${esperanca} pontos entre Pontos de Vida e de Fadiga recuperados.`;
    state.movimentoMorte = { fichaId, fase:'distribuir', valor: esperanca, splitPV: esperanca, splitPF: 0, texto, dadoGrande: esperanca, corDado:'var(--hope)' };
  } else if(f.transformacao && f.transformacao.id==='reanimado' && f.pvMax>1){
    texto += 'O Medo venceu — mas você é Reanimado e "Não Fica Morto".';
    state.movimentoMorte = { fichaId, fase:'reanimado', valor: esperanca, texto, dadoGrande: medo, corDado:'var(--fear)' };
  } else {
    f.status = 'morto';
    await salvarUmaFicha(f, true);
    texto += 'O Medo venceu. O personagem atravessa o véu da morte.';
    state.movimentoMorte = { fichaId, fase:'resultado', texto, dadoGrande: medo, corDado:'var(--fear)' };
  }
  render();
};
App.morteDistribuirConfirmar = async ()=>{
  const mm = state.movimentoMorte;
  const el = document.getElementById('distribuirPVInput');
  const splitPV = Math.max(0, Math.min(mm.valor, Number(el? el.value : mm.splitPV) || 0));
  const splitPF = mm.valor - splitPV;
  const f = getFicha(mm.fichaId);
  f.pv = Math.max(0, f.pv - splitPV);
  f.pf = Math.max(0, f.pf - splitPF);
  f.status = 'vivo';
  await salvarUmaFicha(f, true);
  state.movimentoMorte = { fichaId: mm.fichaId, fase:'resultado', texto: mm.texto + ` Recuperado: ${splitPV} PV e ${splitPF} Fadiga.` };
  render();
};

};

App.contagemCriar = ()=>{
  const nome = document.getElementById('novaContNome').value.trim() || 'Contagem';
  const inicial = Math.max(1, Math.min(20, Number(document.getElementById('novaContValor').value)||4));
  const tipo = document.getElementById('novaContTipo').value;
  const c = state.campanha;
  c.contagens = c.contagens || [];
  c.contagens.push({ id: uid(), nome, tipo, inicial, valor: tipo==='progresso'? 0 : inicial });
  salvarCampanha();
  render();
};
App.contagemAjustar = (id, delta)=>{
  const c = state.campanha;
  const cont = (c.contagens||[]).find(x=>x.id===id);
  if(!cont) return;
  cont.valor = Math.max(0, Math.min(cont.inicial, cont.valor+delta));
  salvarCampanha();
  render();
};
App.contagemRemover = (id)=>{
  const c = state.campanha;
  c.contagens = (c.contagens||[]).filter(x=>x.id!==id);
  salvarCampanha();
  render();
};

App.mostrarCartaMesa = async (fichaId, cardKey)=>{
  const f = getFicha(fichaId);
  if(!f) return;
  const cats = categoriasCartas(f);
  let item = null;
  for(const c of cats){ const found = c.itens.find(it=>it.key===cardKey); if(found){ item = found; break; } }
  if(!item) return;
  const img = (f.cardImages||{})[cardKey];
  const rec = {
    ts: Date.now(), autor: state.usuario.nome, personagem: f.nome || 'Personagem',
    titulo: item.titulo, subtitulo: item.subtitulo, texto: item.texto,
    img: null, fid: f.id, cardKey,   // a imagem não vai junto: quem recebe já tem a da ficha (poupa download a cada abertura)
    imgTransform: img ? imgTransform(img) : '', imgFit: img ? imgFit(img) : 'cover'
  };
  espiaCartasUltimoTs = rec.ts; // evita o próprio broadcast reaparecer pra quem mandou
  state.spotlight = rec; render();
  clearTimeout(spotlightTimer);
  spotlightTimer = setTimeout(()=>{ state.spotlight=null; render(); }, 9000);
  try{ await DB.set(K.spotlight(state.campanha.codigo), rec); }
  catch(e){ console.warn('Não foi possível mostrar a carta para a mesa.', e); }
};

App.cropArquivo = (input)=>{
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const cv = document.createElement('canvas');
      const k = state.cropEditor && state.cropEditor.kind;
      const maxW = k==='retrato'? 640 : k==='carta'? 700 : k==='mundo'? 1600 : 1280;   // o suficiente para o tamanho em que cada uma aparece
      const w = Math.min(maxW, im.width);
      cv.width = w; cv.height = Math.round(im.height/im.width*w);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      state.cropEditor.img = canvasParaJpeg(cv, k==='mundo'? 850000 : 250000);
      state.cropEditor.natAspect = cv.width/cv.height;
      if(k==='mundo'){ state.cropEditor.aspect = 'orig'; state.cropEditor.rect = {x:0,y:0,w:1,h:1}; }   // imagem nova: começa inteira
      state.cropEditor.scale = 1; state.cropEditor.ox = 0; state.cropEditor.oy = 0;
      render();
    };
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
};
App.cropRemover = ()=>{ state.cropEditor.img=''; render(); };
App.cropSalvar = ()=>{
  const c = state.cropEditor;
  const data = { img:c.img, scale:c.scale, ox:c.ox, oy:c.oy, fit:c.fit||'cobrir' };
  state.cropEditor = null;
  if(c.kind==='mundo'){
    const item = mundoEncontrarItem(c.itemId, state.campanha.mundo.itens);
    if(item){
      if(c.img){ const R=c.rect, nat=c.natAspect||1;
        if(c.img!==item.imagem){ item.imgVer = Date.now(); IMGVER.set(K.mimg(state.campanha.codigo,item.id), item.imgVer); }
        item.imagem = c.img; item.imagemRef = true; item.enq = { v:2, aspect:c.aspect, natAspect:nat, x:R.x, y:R.y, w:R.w, h:R.h, asp:(R.w*nat)/R.h }; }
      else { item.imagem = null; item.imagemRef = false; item.enq = null; delete item.imgVer; }
      if(state.mapaViewer && state.mapaViewer.id===c.itemId) state.mapaViewer=null;
    }
    render(); salvarCampanha();
    return;
  }
  if(c.kind==='capa'){
    state.capa = data; CAPA_CACHE.set(state.campanha.codigo, data);
    render();
    DB.set(K.cover(state.campanha.codigo), data);
  } else if(c.kind==='retrato'){
    const f = getFicha(c.fichaId);
    f.retrato = data;
    salvarUmaFicha(f);
  } else if(c.kind==='carta'){
    const f = getFicha(c.fichaId);
    f.cardImages = f.cardImages || {};
    f.cardImages[c.cardKey] = data;
    salvarUmaFicha(f);
  }
};
function cropApplyTransform(){
  const img = document.getElementById('cropImg');
  if(img && state.cropEditor) img.style.transform = `scale(${state.cropEditor.scale}) translate(${state.cropEditor.ox*100}%, ${state.cropEditor.oy*100}%)`;
}
function attachCropListeners(){
  if(!state.cropEditor || !state.cropEditor.img) return;
  const frame = document.getElementById('cropFrame');
  if(!frame) return;
  const pointers = new Map();
  const drag = { active:false, startX:0, startY:0, startOx:0, startOy:0, pinchDist:null, pinchScale:1 };
  frame.onwheel = (e)=>{
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.93;
    state.cropEditor.scale = Math.min(6, Math.max(0.4, state.cropEditor.scale*factor));
    cropApplyTransform();
  };
  frame.onpointerdown = (e)=>{
    frame.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===1){
      drag.active = true;
      drag.startX = e.clientX; drag.startY = e.clientY;
      drag.startOx = state.cropEditor.ox; drag.startOy = state.cropEditor.oy;
    } else if(pointers.size===2){
      drag.active = false;
      const pts = [...pointers.values()];
      drag.pinchDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      drag.pinchScale = state.cropEditor.scale;
    }
  };
  frame.onpointermove = (e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(drag.pinchDist){
        state.cropEditor.scale = Math.min(6, Math.max(0.4, drag.pinchScale*(dist/drag.pinchDist)));
        cropApplyTransform();
      }
    } else if(drag.active && pointers.size===1){
      const rect = frame.getBoundingClientRect();
      const dxFrac = (e.clientX - drag.startX)/rect.width;
      const dyFrac = (e.clientY - drag.startY)/rect.height;
      state.cropEditor.ox = drag.startOx + dxFrac;
      state.cropEditor.oy = drag.startOy + dyFrac;
      cropApplyTransform();
    }
  };
  const endPointer = (e)=>{
    pointers.delete(e.pointerId);
    if(pointers.size<2) drag.pinchDist=null;
    if(pointers.size===0) drag.active=false;
  };
  frame.onpointerup = endPointer;
  frame.onpointercancel = endPointer;
  frame.onpointerleave = (e)=>{ if(pointers.size<=1) endPointer(e); };
}
function mapaApplyTransform(){
  const img = document.getElementById('mapaImg');
  if(img && state.mapaViewer) img.style.transform = `scale(${state.mapaViewer.scale}) translate(${state.mapaViewer.ox*100}%, ${state.mapaViewer.oy*100}%)`;
}

  frame.onpointermove = (e)=>{

      const pts = [...pointers.values()];

      if(drag.pinchDist){
        state.mapaViewer.scale = Math.min(10, Math.max(0.5, drag.pinchScale*(dist/drag.pinchDist)));

      const rect = frame.getBoundingClientRect();

    pointers.delete(e.pointerId);
    if(pointers.size<2) drag.pinchDist=null;
    if(pointers.size===0) drag.active=false;
  };
  frame.onpointerup = endPointer2;
  frame.onpointercancel = endPointer2;
  frame.onpointerleave = (e)=>{ if(pointers.size<=1) endPointer2(e); };
}

App.fEquiparArmadura = (fichaId, armaduraId)=>{
  const f = getFicha(fichaId);
  const armadura = (f.armaduras||[]).find(a=>a.id===armaduraId);
  if(!armadura) return;
  f.armaduraAtiva = { nome: armadura.nome, limiares: armadura.limiares, base: armadura.base, hab: armadura.hab };
  f.armaduraAtivaId = armadura.id;
  f.armaduraMax = Number(armadura.base)||0;
  const partes = String(armadura.limiares).split('/').map(s=>parseInt(s));
  if(partes.length===2 && !isNaN(partes[0]) && !isNaN(partes[1])){
    f.limiarMaiorBase = partes[0]; f.limiarGraveBase = partes[1];
  }
  salvarUmaFicha(f);
};
App.fRemoverArmadura = (fichaId, armaduraId)=>{

function garantirCamposFicha(f){
  if(f.tipo==='npc'){
    if(typeof f.habilidades === 'string'){
      f.habilidades = f.habilidades.trim() ? [{id:uid(), nome:'Habilidade', tipo:'passiva', custo:'', texto:f.habilidades}] : [];
    }
    if(!f.habilidades) f.habilidades = [];
    if(f.experiencia===undefined) f.experiencia = '';
    if(!Array.isArray(f.tags)) f.tags = [];
    if(f.retrato===undefined) f.retrato = null;
    return f;
  }
  if(f.tipo==='ambiente'){
    if(!f.habilidades) f.habilidades = [];
    if(f.ambienteTipo===undefined) f.ambienteTipo = 'Exploração';
    if(f.adversariosSugeridos===undefined) f.adversariosSugeridos = '';
    if(f.impulsos===undefined) f.impulsos = '';
    if(f.difNota===undefined) f.difNota = '';
    return f;
  }
  if(f.tipo!=='pc') return f;
  if(!f.avancos) f.avancos = { 2:{atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,proficiencia:0}, 3:{atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,subclasse:0,proficiencia:0,multiclasse:0}, 4:{atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,subclasse:0,proficiencia:0,multiclasse:0} };
  if(!f.avancos[2]) f.avancos[2] = {atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,proficiencia:0};
  if(!f.avancos[3]) f.avancos[3] = {atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,subclasse:0,proficiencia:0,multiclasse:0};
  if(!f.avancos[4]) f.avancos[4] = {atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,subclasse:0,proficiencia:0,multiclasse:0};
  if(!f.atributosTravados) f.atributosTravados = [];
  if(f.subclasseTier===undefined || f.subclasseTier===null) f.subclasseTier = 0;
  if(f.multiclasse===undefined) f.multiclasse = null;
  if(f.multiclasseNotas===undefined) f.multiclasseNotas = '';
  if(f.cardImages===undefined) f.cardImages = {};
  if(f.retrato===undefined) f.retrato = null;
  if(f.ancestralidadeMista===undefined) f.ancestralidadeMista = null;
  if(f.ancestralidadeMista && Array.isArray(f.ancestralidadeMista.habilidades)){
    f.ancestralidadeMista.habilidades = f.ancestralidadeMista.habilidades.map(h=> Array.isArray(h)? h : [h.nome, h.texto]);
  }
  garantirRecursos(f);
  if(f.cicatrizes===undefined) f.cicatrizes = 0;
  if(f.status===undefined) f.status = 'vivo';
  if(!Array.isArray(f.condicoes)) f.condicoes = [];
  if(!f.armaduras){
    f.armaduras = (f.armaduraAtiva && f.armaduraAtiva.nome) ? [{id:'arm_'+uid(), ...f.armaduraAtiva}] : [];
    f.armaduraAtivaId = f.armaduras[0]? f.armaduras[0].id : null;
  }
  if(f.armaduraAtivaId===undefined) f.armaduraAtivaId = null;
  // a armadura ativa precisa estar na lista e marcada como equipada
  if(f.armaduraAtiva && f.armaduraAtiva.nome && !f.armaduras.some(a=>a.id===f.armaduraAtivaId)){
    const igual = f.armaduras.find(a=>a.nome===f.armaduraAtiva.nome);
    if(igual) f.armaduraAtivaId = igual.id;
    else { const nova={id:'arm_'+uid(), ...f.armaduraAtiva}; f.armaduras.push(nova); f.armaduraAtivaId=nova.id; }
  }
  if(f.limiarMaiorBase===undefined || f.limiarGraveBase===undefined){
    const c = CLASSES[f.classe];
    let lim = [5,11];
    if(c && c.armadura && c.armadura.limiares) lim = c.armadura.limiares.split('/').map(s=>parseInt(s));
    else if(f.armaduraAtiva && f.armaduraAtiva.limiares) lim = f.armaduraAtiva.limiares.split('/').map(s=>parseInt(s));
    if(f.limiarMaiorBase===undefined) f.limiarMaiorBase = (f.limiarMaior!==undefined? f.limiarMaior : lim[0]) || lim[0];
    if(f.limiarGraveBase===undefined) f.limiarGraveBase = (f.limiarGrave!==undefined? f.limiarGrave : lim[1]) || lim[1];
  }
  if(f.limiarBonusMaior===undefined) f.limiarBonusMaior = 0;
  if(f.limiarBonusGrave===undefined) f.limiarBonusGrave = 0;
  return f;
}

function tabelaTesouro(tipo){
  const hf = state.tesouroFonte==='hf';
  return tipo==='item'? (hf? TESOURO_HF : TESOURO_TABELA) : (hf? CONSUMIVEIS_HF : CONSUMIVEIS_TABELA);
}
App.setTesouroFonte = (f)=>{ state.tesouroFonte = f; state.ultimoTesouro = null; render(); };
App.rolarTesouro = (tipo, dados)=>{
  const rolls = Array.from({length:dados}, ()=>d(12));
  const tabela = tabelaTesouro(tipo);
  const soma = Math.min(rolls.reduce((a,b)=>a+b,0), tabela[tabela.length-1][0]);
  const achado = tabela.find(t=>t[0]===soma) || tabela[tabela.length-1];
  state.ultimoTesouro = { nome: achado[1], descricao: achado[2] };
  registrarRolagem({id:uid(), ts:Date.now(), tipo:'simples', autor: state.usuario.nome,
    rotulo:`${tipo==='item'?'Tesouro':'Consumível'}: ${achado[1]} (${dados}d12)`, dados: rolls, mod:0, total: soma});
};
App.recompToggle = (id)=>{
  const i = state.recompSel.indexOf(id);
  if(i>=0) state.recompSel.splice(i,1); else state.recompSel.push(id);

};
App.recompConceder = async ()=>{
  const xp = Number(document.getElementById('recompXp').value)||0;
  const ouro = Number(document.getElementById('recompOuro').value)||0;
  const nota = document.getElementById('recompNota').value;
  if(state.recompSel.length===0) return;
  state.fichas = state.fichas.map(f=> state.recompSel.includes(f.id)
    ? {...f, xp:(f.xp||0)+xp, ouro:{...f.ouro, punhados:(f.ouro?.punhados||0)+ouro}} : f);
  await persistirFichas(state.recompSel);
  const h = {id:uid(), ts:Date.now(), alvos:[...state.recompSel],
    nomes: state.fichas.filter(f=>state.recompSel.includes(f.id)).map(f=>f.nome||'Sem nome'),
    xp, ouro, nota, revertido:false};
  state.historico = [h, ...state.historico];
  await DB.set(K.rewards(state.campanha.codigo), state.historico);
  state.recompSel = [];
  render();
};
App.recompReverter = async (hid)=>{
  const h = state.historico.find(x=>x.id===hid); if(!h) return;
  state.fichas = state.fichas.map(f=> h.alvos.includes(f.id)
    ? {...f, xp:Math.max(0,(f.xp||0)-h.xp), ouro:{...f.ouro, punhados:Math.max(0,(f.ouro?.punhados||0)-h.ouro)}} : f);
  await persistirFichas(h.alvos);
  state.historico = state.historico.map(x=> x.id===hid? {...x, revertido:true} : x);
  await DB.set(K.rewards(state.campanha.codigo), state.historico);
  render();
};
App.resetarXP = async (id)=>{
  state.fichas = state.fichas.map(f=> f.id===id? {...f, xp:0} : f);
  await persistirFichas([id]);
  render();
};
App.limparFicha = async (id)=>{
  const nome = (state.fichas.find(f=>f.id===id)||{}).nome;
  if(!confirm(`Limpar a ficha de ${nome||'sem nome'}? Isso apaga todos os campos.`)) return;
  state.fichas = state.fichas.map(f=> f.id===id? {...novaFicha(f.dono), id:f.id} : f);
  await persistirFichas([id]);
  render();
};

/* Imagens ficam em base64 no estado; colocar isso direto no HTML deixava a tela com vários MB de texto
   (e recomparado a cada clique). Aqui cada imagem vira um endereço curto (blob:) criado uma única vez. */
const BLOBS = new Map();
function imgSrc(s){
  if(!s || typeof s!=='string' || s.slice(0,11)!=='data:image/') return s;
  let u = BLOBS.get(s); if(u) return u;
  try{
    const v = s.indexOf(','), mime = s.slice(5, s.indexOf(';'));
    const bin = atob(s.slice(v+1)), a = new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) a[k] = bin.charCodeAt(k);
    u = URL.createObjectURL(new Blob([a], {type:mime})); BLOBS.set(s, u); return u;
  }catch(e){ return s; }
}
function imgTransform(data){
  return `scale(${data.scale||1}) translate(${(data.ox||0)*100}%, ${(data.oy||0)*100}%)`;
}
const AJUSTES_IMG = [['cobrir','Preencher','Preenche o quadro e corta o que sobra'],['inteira','Inteira','Mostra a imagem toda, sem cortar (pode sobrar fundo)'],['esticar','Esticar','Estica a imagem para encher o quadro (deforma)']];
function imgFit(data){ const f = data && data.fit; return f==='inteira'?'contain' : f==='esticar'?'fill' : 'cover'; }
function imgStyle(data){ return `object-fit:${imgFit(data)};transform:${imgTransform(data)};`; }
function CapaHTML(capa, curto){
  if(capa && capa.img){
    return `<div class="cover ${curto?'short':''}"><img src="${imgSrc(capa.img)}" style="${imgStyle(capa)}"></div>`;
  }
  return `<div class="cover ${curto?'short':''}">✦</div>`;
}

function ListaFichasHTML(lista, vazioTxt){
  if(lista.length===0){

  }
  return `<div class="grid g2">${lista.map(f=>`
    <div class="listitem">
      <div class="info" style="cursor:pointer;flex:1;" onclick="App.abrirFicha('${f.id}')">
        <div style="font-family:var(--serif);font-size:18px;">${esc(f.nome)||'Sem nome'} ${f.tipo==='pc' && f.status==='morto'? `<span style="color:var(--blood);font-size:.8rem;">${icon('caveira',14)} morto</span>` : f.tipo==='pc' && f.status==='inconsciente'? `<span style="color:var(--fear);font-size:.8rem;">inconsciente</span>` : ''}</div>
        <small>${ f.tipo==='pc'
            ? `${esc(f.classe)||'sem classe'}${f.subclasse? ' · '+esc(f.subclasse):''} · nível ${f.nivel}${f.dono? ' · '+esc(f.dono) : ' · sem dono'}`
            : f.tipo==='ambiente' ? `${esc(f.ambienteTipo)} · patamar ${f.patamar} · dificuldade ${f.dificuldade}`

function TabPersonagens(ehMestre){

  if(aberta) return FichaHTML(aberta, ehMestre);
  const pcs = state.fichas.filter(f=>f.tipo==='pc');
  const minhas = pcs.filter(f=>f.dono===state.usuario.nome);
  return `

function todasTagsNPC(){
  const set = new Set();
  state.fichas.filter(f=>f.tipo==='npc').forEach(n=>(n.tags||[]).forEach(t=>set.add(t)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'}));
}

App.npcEditar = (id)=>{ state.abertaId=id; state.npcEditando=id; render(); };
App.npcFecharEdicao = ()=>{ state.npcEditando=null; render(); };
App.npcBuscar = (v)=>{ state.npcBusca=v; render(); };
App.npcCampoNum = (id, campo, val)=>{ const n=getFicha(id); n[campo]=Number(val)||0; agendarSalvar(n); };
App.npcTagAdd = (id)=>{
  const el = document.getElementById('tagNova_'+id); const t = (el && el.value || '').trim().replace(/\s+/g,' ').slice(0,30); if(!t) return;
  const n = getFicha(id); n.tags = n.tags || [];
  if(!n.tags.some(x=>x.toLowerCase()===t.toLowerCase())) n.tags.push(t);
  salvarUmaFicha(n);
};
App.npcTagRem = (id, t)=>{ const n=getFicha(id); n.tags=(n.tags||[]).filter(x=>x!==t); salvarUmaFicha(n); };
App.npcTagFiltro = (t)=>{ const a = state.npcTagsSel||[]; state.npcTagsSel = a.includes(t)? a.filter(x=>x!==t) : [...a,t]; render(); };
App.npcTagLimpar = ()=>{ state.npcTagsSel=[]; render(); };
function TabNPCs(){
  if(state.criando==='npc-wizard' && state.npcWiz) return NPCWizardHTML();
  const todos = state.fichas.filter(f=>f.tipo==='npc');
  const busca = (state.npcBusca||'').toLowerCase().trim();
  const tagsSel = (state.npcTagsSel||[]).filter(t=>todasTagsNPC().includes(t));
  const npcs = todos
    .filter(n=>!busca || (n.nome||'').toLowerCase().includes(busca) || (n.papel||'').toLowerCase().includes(busca))
    .filter(n=>!tagsSel.length || (n.tags||[]).some(t=>tagsSel.includes(t)))
    .sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR',{sensitivity:'base'}));
  const sel = todos.find(f=>f.id===state.abertaId) || null;
  const editando = sel && state.npcEditando===sel.id;
  const tags = todasTagsNPC();
  return `
  <div style="margin-bottom:16px;" class="row"><button class="btn btn-gold" onclick="App.npcwAbrir()">${icon('mais',15)} Criar com o assistente</button><button class="btn" onclick="App.criarFichaZero()">Criar do zero</button><button class="btn btn-purple" onclick="App.abrirBestiario()">${icon('caveira',15)} Bestiário</button></div>
  ${todos.length===0? `<div class="empty"><p class="big">Nenhum monstro criado ainda</p></div>` : `
  <div class="npc-layout">
    <div>
      <input placeholder="Buscar..." value="${esc(state.npcBusca||'')}" oninput="App.npcBuscar(this.value)" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--field);color:var(--parch);margin-bottom:8px;">
      ${tags.length? `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;">${tags.map(t=>`<span class="tag-chip ${tagsSel.includes(t)?'on':''}" onclick="App.npcTagFiltro(${JSON.stringify(t).replace(/"/g,'&quot;')})">${esc(t)}</span>`).join('')}${tagsSel.length? `<span class="muted" style="font-size:12.5px;cursor:pointer;align-self:center;text-decoration:underline;" onclick="App.npcTagLimpar()">limpar</span>`:''}</div>`:''}
      <div class="npc-lista">${npcs.length? npcs.map(n=>`<button class="npc-item ${sel&&sel.id===n.id?'sel':''}" onclick="App.abrirFicha('${n.id}')"><b>${esc(n.nome)||'Sem nome'}</b><small>${esc(n.papel)} · P${n.patamar} · Dif ${n.dificuldade} · PV ${n.pv}/${n.pvMax} · PF ${n.pf}/${n.pfMax}</small></button>`).join('') : '<p class="muted" style="font-size:13px;">Nenhum resultado.</p>'}</div>
    </div>
    <div>${sel? (editando? npcEdicaoHTML(sel) : npcCompactoHTML(sel)) : `<div class="empty"><p class="big">Escolha um monstro na lista</p></div>`}</div>
  </div>`}
  `;
}

      </div>`).join('')}
  </div>`;

function ImagemMundoHTML(item){
  if(!item.imagem){   // imagem existe no banco mas ainda não foi baixada
    const erro = state.mundoImgEstado[item.id]==='erro';
    return `<div class="img-carregando">${erro
      ? `<span>Não foi possível carregar a imagem.</span><button class="btn btn-sm btn-gold" onclick="App.mundoRecarregarImagem('${item.id}')">Tentar de novo</button>`
      : `<span class="pulsa">Carregando imagem…</span>`}</div>`;

function enqRectStyle(r){ return `left:${r.x*100}%;top:${r.y*100}%;width:${r.w*100}%;height:${r.h*100}%;`; }
function enqAplicar(){
  const el=document.getElementById('enqRect'); const c=state.cropEditor;
  if(el && c && c.rect) el.setAttribute('style', enqRectStyle(c.rect));
}
function attachEnqListeners(){
  const c = state.cropEditor;
  if(!c || c.kind!=='mundo' || !c.img) return;
  const box = document.getElementById('enqBox'); if(!box) return;
  const MIN = 0.04;
  const q = ()=>{ const r=razaoAspecto(c.aspect, c.natAspect||1); return r? r/(c.natAspect||1) : null; };  // w/h em frações; null = livre
  let modo=null, start=null;
  const pos = (e)=>{ const b=box.getBoundingClientRect(); return { x:Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)), y:Math.max(0,Math.min(1,(e.clientY-b.top)/b.height)), bw:b.width, bh:b.height }; };
  const limitar = (R)=>{ R.w=Math.max(MIN,Math.min(1,R.w)); R.h=Math.max(MIN,Math.min(1,R.h)); R.x=Math.max(0,Math.min(1-R.w,R.x)); R.y=Math.max(0,Math.min(1-R.h,R.y)); return R; };
  box.onpointerdown = (e)=>{
    const alvo = e.target.closest ? e.target : e.target;
    const canto = alvo.dataset && alvo.dataset.c;
    const dentro = alvo.id==='enqRect' || canto;
    if(!dentro) return;
    e.preventDefault(); box.setPointerCapture(e.pointerId);
    const p = pos(e); start = { p, R:{...c.rect} };
    if(canto){
      modo = 'resize';
      const R=c.rect;  // âncora = canto oposto
      start.ax = canto.includes('w')? R.x+R.w : R.x;
      start.ay = canto.includes('n')? R.y+R.h : R.y;
    } else modo = 'move';
  };
  box.onpointermove = (e)=>{
    if(!modo) return;
    const p = pos(e); const R = {...start.R};
    if(modo==='move'){
      R.x = start.R.x + (p.x-start.p.x); R.y = start.R.y + (p.y-start.p.y); limitar(R);
    } else {
      const ax=start.ax, ay=start.ay; const sx = p.x>=ax? 1 : -1, sy = p.y>=ay? 1 : -1;
      let w = Math.abs(p.x-ax), h = Math.abs(p.y-ay); const Q=q();
      if(Q){ w = Math.min(w, h*Q); h = w/Q; }
      const maxW = sx>0? 1-ax : ax, maxH = sy>0? 1-ay : ay;
      if(Q){ if(w>maxW){ w=maxW; h=w/Q; } if(h>maxH){ h=maxH; w=h*Q; } } else { w=Math.min(w,maxW); h=Math.min(h,maxH); }
      w=Math.max(MIN,w); h=Q? w/Q : Math.max(MIN,h);
      R.w=w; R.h=h; R.x = sx>0? ax : ax-w; R.y = sy>0? ay : ay-h;
    }
    c.rect = R; enqAplicar();
  };
  const fim = (e)=>{ modo=null; start=null; };
  box.onpointerup = fim; box.onpointercancel = fim;
  box.onwheel = (e)=>{
    e.preventDefault();
    const R={...c.rect}, f = e.deltaY<0? 0.93 : 1.08, Q=q();
    const cx=R.x+R.w/2, cy=R.y+R.h/2; let w=R.w*f, h=R.h*f;
    if(Q){ if(w>1){ w=1; h=w/Q; } if(h>1){ h=1; w=h*Q; } }
    R.w=w; R.h=h; R.x=cx-w/2; R.y=cy-h/2; c.rect=limitar(R); enqAplicar();
  };
}

function garantirRecursos(f){
  const pad = {favor:3, focus:0, comboDado:'d4', alvo:'', alvoAtivo:false, tokens:0, patronoNome:'', patronoEsfera:'', hexes:[], estanciasConhecidas:[], estanciaAtiva:'', fase:0, ultimoCommune:null};
  if(!f.recursos) f.recursos = {};
  for(const k in pad) if(f.recursos[k]===undefined) f.recursos[k] = pad[k];
  if(f.transformacao===undefined) f.transformacao = null;
  return f.recursos;
}
function atributoConjuracao(f){
  const s = SUBCLASSES[f.classe] && SUBCLASSES[f.classe][f.subclasseId];
  const nome = s && s.atributo; const k = MAPA_ATRIB[nome];
  return { nome: nome||'—', valor: k? (f.atributos[k]||0) : 0 };
}

function EstanciasHTML(f, st){
  const r = f.recursos; const tier = tierDoNivel(f.nivel||1); const edit = painelEditando('estancias', f.id);
  let html = `<hr style="border:none;border-top:1px solid var(--line);margin:14px 0;">
    <div class="between" style="margin-bottom:8px;"><strong>Foco & Posturas Marciais</strong>${lapisEditBtn('estancias',f.id)}</div>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
      <span>Foco:</span><button class="btn btn-sm btn-ghost" onclick="App.fRecNum('${f.id}','focus',-1,0,6)">−</button>
      <strong style="font-size:1.3rem;color:var(--hope);">${r.focus}/6</strong>
      <button class="btn btn-sm btn-ghost" onclick="App.fRecNum('${f.id}','focus',1,0,6)">+</button>
      <button class="btn btn-sm btn-gold" onclick="App.fRefocar('${f.id}')">Refocar (${Math.max(1,f.atributos.instinto||0)}d6)</button></div>
    ${r.estanciaAtiva? `<p style="margin:0 0 10px;color:var(--hope);">Postura ativa: <strong>${esc(r.estanciaAtiva)}</strong> <button class="btn btn-sm btn-ghost" onclick="App.fSairEstancia('${f.id}')">Sair da postura</button></p>` : '<p class="muted" style="font-size:13px;margin:0 0 10px;">Nenhuma postura ativa. Assumir uma custa 1 Foco.</p>'}`;
  for(let t=1;t<=4;t++){
    if(t>tier) break;
    html += `<p class="muted" style="margin:10px 0 4px;font-size:12px;">${t}º patamar</p>`;
    html += ESTANCIAS[t].map(([n,tx])=>{
      const conhecida = r.estanciasConhecidas.includes(n);
      if(!edit && !conhecida) return '';
      const ativa = r.estanciaAtiva===n;
      return `<div class="listitem" style="${ativa?'border-color:var(--hope);background:rgba(232,181,79,.08);':''}">
        <div class="info" style="flex:1;"><strong>${esc(n)}</strong><div class="muted" style="font-size:12px;">${esc(tx)}</div></div>
        ${edit? `<label class="row" style="gap:6px;font-size:12px;"><input type="checkbox" ${conhecida?'checked':''} onchange="App.fEstanciaConhecer('${f.id}','${esc(n)}')"> conhecida</label>`
              : (ativa? '' : `<button class="btn btn-sm btn-gold" onclick="App.fAssumirEstancia('${f.id}','${esc(n)}')">Assumir</button>`)}
      </div>`;}).join('');
  }
  if(!edit && r.estanciasConhecidas.length===0) html += '<p class="muted" style="font-size:13px;">Nenhuma postura conhecida. Clique no lápis para escolher duas do 1º patamar.</p>';
  html += `<p class="muted" style="font-size:12px;margin-top:8px;">Conhecidas: ${r.estanciasConhecidas.length} (comece com 2 do 1º patamar e adicione 1 a cada nível)${st>=2? ' · Estado de Fluxo: pode pagar 1 Fadiga em vez de 1 Foco para mudar de postura.':''}</p>`;
  return html;
}

/* ---- ações ---- */
App.fRec = (id,campo,val)=>{ const f=getFicha(id); garantirRecursos(f); f.recursos[campo]=val; agendarSalvar(f); };
App.fRecNum = (id,campo,delta,min,max)=>{ const f=getFicha(id); const r=garantirRecursos(f); r[campo]=Math.max(min,Math.min(max,(r[campo]||0)+delta)); salvarUmaFicha(f); };
App.fRecZerar = (id,campo)=>{ const f=getFicha(id); garantirRecursos(f).tokens=0; salvarUmaFicha(f); };
App.fAssassinoMarcar = (id,on)=>{ const f=getFicha(id); const r=garantirRecursos(f); if(on){ marcarFadigaFicha(f,1); } r.alvoAtivo=on; salvarUmaFicha(f); };
App.fAssassinoDano = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const tier=tierDoNivel(f.nivel||1); const st=f.subclasseTier||0;
  const lado = f.subclasseId==='Guilda dos Executores'? (st>=2?8:6) : 4; const dados=Array.from({length:tier},()=>d(lado));
  logRolagem(f, `Marcado para Morrer · ${tier}d${lado}${r.alvo? ' em '+r.alvo:''}`, dados, dados.reduce((a,b)=>a+b,0)); };
App.fVenenoPreparar = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); marcarFadigaFicha(f,1); const n=d(4)+1; r.tokens=(r.tokens||0)+n; salvarUmaFicha(f); };
App.fComboPasso = (id,dir)=>{ const f=getFicha(id); const r=garantirRecursos(f); let i=COMBO_PASSOS.indexOf(r.comboDado); i=Math.max(0,Math.min(COMBO_PASSOS.length-1,i+dir)); r.comboDado=COMBO_PASSOS[i]; salvarUmaFicha(f); };
App.fGolpeCombo = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const lados=parseInt(r.comboDado.slice(1));
  marcarFadigaFicha(f,1); const rolls=[d(lados)]; let guard=0;
  while(guard++<60){ const n=d(lados); rolls.push(n); if(n<rolls[rolls.length-2]) break; }
  salvarUmaFicha(f,true); logRolagem(f, `Golpe Combo (${r.comboDado})`, rolls, rolls.reduce((a,b)=>a+b,0)); };
App.fRefocar = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const n=Math.max(1,f.atributos.instinto||0);
  const rolls=Array.from({length:n},()=>d(6)); r.focus=Math.min(6,Math.max(...rolls)); salvarUmaFicha(f,true);
  logRolagem(f, `Refocar (${n}d6 — maior = Foco)`, rolls, r.focus); };
App.fEstanciaConhecer = (id,nome)=>{ const f=getFicha(id); const r=garantirRecursos(f); const i=r.estanciasConhecidas.indexOf(nome); if(i>=0) r.estanciasConhecidas.splice(i,1); else r.estanciasConhecidas.push(nome); salvarUmaFicha(f); };
App.fAssumirEstancia = (id,nome)=>{ const f=getFicha(id); const r=garantirRecursos(f); const st=f.subclasseTier||0;
  if(r.focus>0) r.focus-=1; else if(st>=2){ marcarFadigaFicha(f,1); } else { alert('Você precisa de 1 Foco para assumir uma postura.'); return; }
  r.estanciaAtiva=nome; salvarUmaFicha(f); };
App.fSairEstancia = (id)=>{ const f=getFicha(id); garantirRecursos(f).estanciaAtiva=''; salvarUmaFicha(f); };
App.fRolarPatrono = (id,gastar)=>{ const f=getFicha(id); const r=garantirRecursos(f); const el=document.getElementById('patronoN');
  const n=Math.max(1,Math.min(20,parseInt(el&&el.value)||1)); if(gastar){ if((r.favor||0)<n){ alert('Favores insuficientes.'); return; } r.favor-=n; }
  const lado=(f.nivel||1)>=5?8:6; const dados=Array.from({length:n},()=>d(lado)); salvarUmaFicha(f,true);
  logRolagem(f, `Dado${n>1?'s':''} de Patrono (${n}d${lado})${r.patronoNome? ' · '+r.patronoNome:''}`, dados, dados.reduce((a,b)=>a+b,0)); };
App.fBruxoTributo = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); r.favor=(r.favor||0)+Math.max(0,atributoConjuracao(f).valor); salvarUmaFicha(f); };
App.fHexAdicionar = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const max=Math.max(1,atributoConjuracao(f).valor);
  if(r.hexes.length>=max){ alert('Você já está no máximo de criaturas sob Malefício ('+max+'). Remova uma antes.'); return; }
  const el=document.getElementById('hexNome'); const nome=(el&&el.value.trim())||('Alvo '+(r.hexes.length+1));
  marcarFadigaFicha(f,1); r.hexes.push(nome); salvarUmaFicha(f); };
App.fHexRemover = (id,i)=>{ const f=getFicha(id); garantirRecursos(f).hexes.splice(i,1); salvarUmaFicha(f); };
App.fComunhao = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const n=Math.max(1,atributoConjuracao(f).valor);
  const dados=Array.from({length:n},()=>d(6)); r.ultimoCommune={dados}; salvarUmaFicha(f,true);
  logRolagem(f, `Comunhão (${n}d6 — escolha um)`, dados, Math.max(...dados)); };
App.fFaseLua = (id,inc)=>{ const f=getFicha(id); const r=garantirRecursos(f);
  if(!inc){ r.fase=d(6); } else { if(!r.fase){ alert('Role a fase da sessão primeiro.'); return; } if((f.esperanca||0)<1){ alert('Você precisa de 1 Esperança.'); return; } f.esperanca-=1; r.fase = r.fase>=6? 1 : r.fase+1; }
  salvarUmaFicha(f); };

/* Reanimado: "Não Fica Morto" no movimento de morte */
App.morteReanimado = async (sobreviver)=>{
  const mm=state.movimentoMorte; const f=getFicha(mm.fichaId);
  if(sobreviver){
    f.pvMax=Math.max(1,f.pvMax-1); f.pv=Math.min(f.pv,f.pvMax);
    state.movimentoMorte={fichaId:mm.fichaId, fase:'distribuir', valor:mm.valor, splitPV:mm.valor, splitPF:0, dadoGrande:mm.valor, corDado:'var(--hope)',
      texto:`Não Fica Morto! Você marcou 1 Ponto de Vida permanentemente (máximo agora ${f.pvMax}) e sobrevive. Distribua ${mm.valor} pontos (valor do Dado de Esperança) entre Pontos de Vida e Fadiga recuperados.`};
    await salvarUmaFicha(f,true);
  } else {
    f.status='morto'; await salvarUmaFicha(f,true);
    state.movimentoMorte={fichaId:mm.fichaId, fase:'resultado', texto:mm.texto+' O personagem atravessa o véu da morte.', dadoGrande:mm.dadoGrande, corDado:'var(--fear)'};
  }
  render();
};

function tituloCase(t){
  const peq = new Set(['de','da','do','das','dos','e','a','o','para','com','em','ou']);
  return String(t).toLowerCase().split(/\s+/).map((w,i)=> (i>0 && peq.has(w))? w : w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
/* Habilidades de classe: o texto da ficha ("NOME — descrição", separadas por linha em branco) vira uma carta por habilidade. */
function cartasDeClasse(f){
  const txt = typeof f.habilidades==='string' ? f.habilidades.trim() : '';
  if(!txt) return [];
  return txt.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map((par,i)=>{
    const m = par.match(/^([A-ZÀ-ÝÇ0-9][A-ZÀ-ÝÇ0-9 ,'’\-]*?)\s+[—–-]\s+([\s\S]*)$/);
    const titulo = m? tituloCase(m[1]) : 'Habilidade de classe '+(i+1);
    return { key:`Classe|${titulo}`, titulo, subtitulo:`${f.classe} · habilidade de classe`, texto: m? m[2].trim() : par };
  });
}
function cartasDeSubclasse(f){
  const s = f.classe && f.subclasseId && SUBCLASSES[f.classe] && SUBCLASSES[f.classe][f.subclasseId];
  if(!s) return {itens:[], bloqueio:''};
  const tier = f.subclasseTier||0, itens = [];
  const add = (lista, rot)=> (lista||[]).forEach(([n,t])=>itens.push({key:`Subclasse|${n}`, titulo:n, subtitulo:`${f.subclasseId} · ${rot}`, texto:t}));
  add(s.fundamentais, 'fundamental');
  if(tier>=1) add(s.especializacao, 'especialização');
  if(tier>=2) add(s.maestria, 'maestria');
  const bl = [];
  if(tier<1 && s.especializacao && s.especializacao.length) bl.push('Especialização ainda bloqueada — desbloqueie subindo de nível.');
  else if(tier<2 && s.maestria && s.maestria.length && tier>=1) bl.push('Maestria ainda bloqueada — desbloqueie subindo de nível.');
  return {itens, bloqueio: bl.join(' '), atributo: s.atributo||''};
}
function categoriasCartas(f){
  const ancHabs = getAncestralidadeHabs(f);
  const com = COMUNIDADES_INFO[f.comunidade];
  const todasCartas = [...(f.mao||[]).map(k=>({key:k,local:'Mão'})), ...(f.reserva||[]).map(k=>({key:k,local:'Reserva'}))]
    .map(x=>({...x, carta: findCard(x.key)})).filter(x=>x.carta);
  const feiticos = todasCartas.filter(x=> x.carta.tipo.includes('Feitiço') || x.carta.tipo.includes('Grimório'));
  const talentos = todasCartas.filter(x=> x.carta.tipo==='Talento');
  const cats = [];
  const cls = cartasDeClasse(f); if(f.classe) cats.push({id:'classe', nome:`Classe (${cls.length})`, itens: cls});
  const sub = cartasDeSubclasse(f); if(sub.itens.length || sub.bloqueio) cats.push({id:'subclasse', nome:`Subclasse (${sub.itens.length})`, itens: sub.itens, aviso: sub.bloqueio, atributo: sub.atributo});
  if(ancHabs) cats.push({id:'ancestralidade', nome:'Ancestralidade', itens: ancHabs.map(([n,t])=>(
    {key:`Ancestralidade|${n}`, titulo:n, subtitulo:f.ancestralidade, texto:t}))});
  if(com) cats.push({id:'comunidade', nome:'Comunidade', itens: [
    {key:`Comunidade|${com.habilidade[0]}`, titulo:com.habilidade[0], subtitulo:f.comunidade, texto:com.habilidade[1]}]});
  cats.push({id:'feiticos', nome:`Feitiços & Grimórios (${feiticos.length})`, itens: feiticos.map(x=>(
    {key:x.key, titulo:x.carta.nome, subtitulo:`${x.carta.dominio} · nv.${x.carta.nivel} · ${x.local}`, texto:x.carta.texto, removivel:true, local:x.local}))});
  cats.push({id:'talentos', nome:`Talentos (${talentos.length})`, itens: talentos.map(x=>(
    {key:x.key, titulo:x.carta.nome, subtitulo:`${x.carta.dominio} · nv.${x.carta.nivel} · ${x.local}`, texto:x.carta.texto, removivel:true, local:x.local}))});
  return cats;
}

      <div class="panel" data-accent="combat"><div class="panel-head"><h3>${lapisEditBtn('armadura',f.id)}${icon('escudo')} Armadura ativa</h3><button class="btn btn-sm btn-gold" onclick="App.abrirLoja('${f.id}','armaduras')">${icon('mochila',15)} Adquirir Itens</button></div><div class="panel-body">

              <div class="info" style="flex:1;">
                <strong style="font-family:var(--serif);font-size:15px;color:var(--parch);">${esc(a.nome)}</strong>
                <div class="muted" style="font-size:12px;">limiares ${esc(a.limiares)} · armadura base ${esc(a.base)}</div>
              </div>
              <div class="row" style="gap:6px;">
                ${f.armaduraAtivaId===a.id
                  ? `<span class="muted" style="font-size:12px;color:var(--hope);">${icon('check',14)} equipada</span>`

                <button class="icon-btn-danger" title="Remover da lista" onclick="App.fRemoverArmadura('${f.id}','${a.id}')">${icon('lixeira',14)}</button>

          const campoNum = (label,campo)=> editando
            ? `<div class="field"><label>${label}</label><input type="number" value="${f[campo]}" onchange="App.fCampoNum('${f.id}','${campo}',this.value)"></div>`
            : `<div class="field"><label>${label}</label><div class="stat-display">${f[campo]}</div></div>`;
          return `

          <button class="btn btn-sm btn-gold" onclick="App.abrirLoja('${f.id}')">${icon('mochila',14)} Adquirir Itens</button>

        <div class="panel-body">
        ${ (f.inventario||[]).length===0? '<p class="muted" style="margin:0;font-size:13px;">Bolsa vazia.</p>' : f.inventario.map((it,i)=> painelEditando('inventario',f.id) ? `
          <div class="row" style="margin-bottom:8px;">
            <input value="${esc(it)}" style="flex:1;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" oninput="App.fInvSet('${f.id}',${i},this.value)">

      ${MulticlassePanelHTML(f)}

      ${f.classe==='Druida'? BeastFormPanelHTML(f) : ''}
      ${['Assassino','Lutador','Bruxo','Bruxa'].includes(f.classe)? ClassResourcesHTML(f) : ''}
      ${f.tipo==='pc'? TransformacaoPanelHTML(f) : ''}

        <p class="muted" style="font-size:12px;margin:0 0 8px;">Pergunta de origem</p>

          ${ORIGENS[f.classe].map((p,i)=>`<option value="${i}" ${Number(f.origemIdx||0)===i?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <textarea rows="3" placeholder="Sua resposta..." style="width:100%;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" oninput="App.fCampo('${f.id}','origemResposta',this.value)">${esc(f.origemResposta)}</textarea>
        <p class="muted" style="font-size:12px;margin:16px 0 8px;">Vínculos — perguntas para os outros jogadores</p>
        <ul style="margin:0 0 8px;padding-left:18px;font-size:12px;color:var(--muted);">

        <textarea rows="3" placeholder="Anotações sobre os vínculos do grupo..." style="width:100%;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" oninput="App.fCampo('${f.id}','vinculosNotas',this.value)">${esc(f.vinculosNotas)}</textarea>
      </div>` : ''}</div>` : ''}

      <div class="panel" data-accent="lore"><div class="panel-head"><h3>${icon('pergaminho')} Anotações</h3></div><div class="panel-body">

      </div></div>
    </div>
  </div>
  `;
}

function HabilidadesListHTML(f){
  const habs = f.habilidades || [];
  return `<div class="panel"><div class="panel-head"><h3>${icon('livro')} Habilidades</h3><button class="btn btn-sm btn-gold" onclick="App.habAdd('${f.id}')">${icon('mais',15)} Adicionar</button></div>
    <div class="panel-body">
      ${habs.length===0? '<p class="muted" style="margin:0;">Nenhuma habilidade ainda. Habilidades podem ser passivas, ações ou reações — e algumas exigem gastar Pontos de Medo ou de Fadiga.</p>' : habs.map(h=>`
        <div style="padding:12px 0;border-bottom:1px solid var(--line);">
          <div class="grid g4" style="margin-bottom:8px;">
            <div class="field" style="grid-column:span 2;"><label>Nome</label><input value="${esc(h.nome)}" oninput="App.habCampo('${f.id}','${h.id}','nome',this.value)"></div>
            <div class="field"><label>Tipo</label>
              <select onchange="App.habCampo('${f.id}','${h.id}','tipo',this.value)">
                <option value="passiva" ${h.tipo==='passiva'?'selected':''}>Passiva</option>
                <option value="ação" ${h.tipo==='ação'?'selected':''}>Ação</option>
                <option value="reação" ${h.tipo==='reação'?'selected':''}>Reação</option>
              </select>
            </div>
            <div class="field"><label>Custo (opcional)</label><input value="${esc(h.custo)}" placeholder="ex: 1 Medo" oninput="App.habCampo('${f.id}','${h.id}','custo',this.value)"></div>
          </div>
          <textarea rows="2" style="width:100%;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" oninput="App.habCampo('${f.id}','${h.id}','texto',this.value)">${esc(h.texto)}</textarea>
          ${f.tipo==='ambiente'? dadosChipsHTML(h.texto, f.nome, h.nome) : ''}
          ${f.tipo==='ambiente'? `<textarea rows="2" placeholder="Perguntas para a mesa (opcional)" style="width:100%;margin-top:8px;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);font-style:italic;" oninput="App.habCampo('${f.id}','${h.id}','perguntas',this.value)">${esc(h.perguntas||'')}</textarea>`:''}
          <button class="btn btn-sm btn-danger" style="margin-top:8px;" onclick="App.habRemover('${f.id}','${h.id}')">Remover</button>
        </div>`).join('')}
    </div></div>`;
}
function AmbienteHTML(a){

        <select onchange="App.ambienteCampo('${a.id}','ambienteTipo',this.value)">

    <div class="field" style="margin-top:12px;"><label>Impulsos</label><input value="${esc(a.impulsos||'')}" placeholder="ex: cruzar bancos de areia, arrastar despreparados" oninput="App.ambienteCampo('${a.id}','impulsos',this.value)"></div>
  </div></div>

  <div class="cols2">
    <div class="panel"><div class="panel-head"><h3>Dificuldade</h3></div><div class="panel-body">
      <div class="field"><input type="number" value="${a.dificuldade}" oninput="App.ambienteCampoNum('${a.id}','dificuldade',this.value)"></div>
      <p class="muted" style="font-size:12px;margin:10px 0 0;">Base para testes feitos em oposição direta aos elementos do ambiente. Monstros individuais podem ter Dificuldades próprias.</p>

    <div class="panel"><div class="panel-head"><h3>Monstros sugeridos</h3></div><div class="panel-body">

    </div></div>
  </div>

  ${HabilidadesListHTML(a)}
  `;

function NPCHTML(n){

const NPC_EXP_SUGESTOES = ['Acrobacia','Emboscada','Barganha','Espadachim','Guarda-costas','Comandante','Caçar do alto','Intimidação','Intruso','Sentidos aguçados','Conhecimento mágico','Amigo da natureza','Navegação','Nobreza','Reflexos rápidos','Socialite','Furtividade','Rastreador'];

function npcMod(n){ return n>=0 ? '+'+n : '−'+Math.abs(n); }
function npcDanoHab(pat){ return {1:'1d10+2',2:'2d8+4',3:'3d10+5',4:'4d10+10'}[pat]; }
/* Habilidades-modelo tiradas dos exemplos do livro (p.195-196). {D} = dano sugerido do patamar; {X} = número do patamar. */
const NPC_HAB_MODELOS = [

  { nome:'Lacaio ({L})', tipo:'passiva', ideal:['Lacaio'], texto:'Este monstro é derrotado quando sofre qualquer dano. Para cada {L} pontos de dano causados por um personagem a este monstro, um lacaio adicional no alcance, e que seria atingido pelo ataque, é derrotado.' },
  { nome:'Inclemente ({I})', tipo:'passiva', ideal:['Solo','Brutamonte'], texto:'Este monstro pode ser posto em foco {I} vezes a cada turno do mestre. Gaste Pontos de Medo normalmente para colocá-lo em foco.' },
  { nome:'Lentidão', tipo:'passiva', ideal:['Brutamonte','Solo'], texto:'Se este monstro for posto em foco, mas não tiver nenhum marcador em sua ficha, ele é incapaz de agir. Coloque um marcador na ficha e descreva o que ele está se preparando para fazer. Quando puser este monstro em foco e ele tiver um marcador na ficha, remova o marcador para que ele possa agir.' },

  { nome:'Desforra', tipo:'ação', ideal:['Comum','Oportunista','Brutamonte'], texto:'Faça um ataque contra um alvo Muito Próximo. Se o atingir, cause {D} pontos de dano físico direto.' },
  { nome:'Ataque em Grupo', tipo:'ação', ideal:['Lacaio'], texto:'Gaste 1 Ponto de Medo para escolher um alvo e pôr em foco todos os monstros com o mesmo nome deste lacaio em determinado alcance do alvo. Esses lacaios ficam Corpo a Corpo ao alvo e fazem um teste de ataque compartilhado. Se acertarem, cada um causa {F} pontos de dano. Os danos são somados.' },
  { nome:'Explosão', tipo:'ação', ideal:['Solo','Líder','Atirador'], custo:'1 Medo', texto:'Gaste 1 Ponto de Medo para explodir em energia. Faça um ataque contra todos os alvos Próximos. Alvos atingidos sofrem {D} pontos de dano mágico e são empurrados para um ponto em alcance Distante.' },
  { nome:'Tem Mais de Onde Veio', tipo:'ação', ideal:['Líder'], texto:'Invoque três monstros aliados do mesmo patamar, que surgem em alcance Distante.' },
  { nome:'Táticas', tipo:'ação', ideal:['Líder','Assistente'], custo:'1 PF', texto:'Marque 1 Ponto de Fadiga para pôr em foco este monstro e mais dois aliados Próximos.' },
  { nome:'Estorvar', tipo:'ação', ideal:['Assistente','Oportunista','Manipulador'], custo:'1 PF', texto:'Marque 1 Ponto de Fadiga e escolha um alvo Próximo: ele deve passar em um teste de reação de Agilidade ou ficará Vulnerável até o fim da cena (ou até ser libertado).' },
  { nome:'Ataque Combinado', tipo:'reação', ideal:['Comum','Líder','Horda'], custo:'1 PF', texto:'Quando outro monstro Muito Próximo deste causar {X} pontos de dano a uma criatura, você pode marcar 1 Ponto de Fadiga para fazer um ataque padrão contra a mesma criatura. Em caso de sucesso, os danos são somados.' },
  { nome:'Bate Forte', tipo:'reação', ideal:['Brutamonte','Solo','Comum'], custo:'1 Medo', texto:'Quando este monstro causa dano com um ataque padrão, você pode gastar 1 Ponto de Medo para somar um bônus de +{X} à rolagem de dano.' },
  { nome:'Impulso', tipo:'reação', ideal:['Atirador','Oportunista','Líder'], texto:'Quando este monstro realizar um ataque bem-sucedido contra um personagem, receba 1 Ponto de Medo.' }

function npcHabDoModelo(m, pat, tipo){
  const X = {1:2,2:4,3:6,4:8}[pat];
  const H = {1:'1d4+2',2:'1d6+3',3:'2d6+4',4:'3d6+5'}[pat];
  const sub = s => s.replace(/\{D\}/g, npcDanoHab(pat)).replace(/\{X\}/g, X).replace(/\{H\}/g, H).replace(/\{L\}/g, NPC_LACAIO_X[pat]).replace(/\{I\}/g, pat>=3?3:2).replace(/\{F\}/g, NPC_LACAIO_DANO[pat]);
  return { id:uid(), nome:sub(m.nome), tipo:m.tipo, custo:m.custo||'', texto:sub(m.texto) };
}
function npcPreset(tipo, pat){
  const B = NPC_TABELA[pat], A = NPC_TIPOS[tipo] || NPC_TIPOS['Comum'];
  const sem = !!A.semLimiar;
  const danoDado = A.dano===0 && tipo==='Manipulador' ? ({1:'1d4+2',2:'1d6+3',3:'1d8+4',4:'2d8+5'}[pat]) : B.dado[A.dano];
  return {
    dificuldade: B.dif + A.d,
    limiarMaior: sem ? 0 : Math.max(1, B.lm + A.l*pat),
    limiarGrave: (sem || A.semGrave) ? 0 : Math.max(2, B.lg + A.g*pat),
    pvMax: Math.max(1, A.pv + Math.floor((pat-1)*A.pvp)),
    pfMax: A.pf + (pat>=3 && tipo!=='Lacaio' ? 1 : 0),
    atkMod: B.atk + A.a,
    alcance: A.alc,
    dano: tipo==='Lacaio' ? String(NPC_LACAIO_DANO[pat]) : danoDado
  };
}
function npcAplicarPreset(w){
  const n = w.n, p = npcPreset(n.papel, n.patamar);
  n.dificuldade = p.dificuldade; n.limiarMaior = p.limiarMaior; n.limiarGrave = p.limiarGrave;
  n.pvMax = p.pvMax; n.pfMax = p.pfMax;
  n.ataque.atr = npcMod(p.atkMod);
  if(!w.ataqueEditado){ n.ataque.alcance = p.alcance; w.danoDado = p.dano; w.danoTipo = w.danoTipo||'fís'; n.ataque.dano = w.danoDado + ' ' + w.danoTipo; if(n.papel==='Lacaio') n.ataque.dano = p.dano+' '+w.danoTipo; }
  w.manual = false;
}
function npcWizNovo(){
  const n = novoNPC();
  n.nome = ''; n.papel = 'Comum'; n.patamar = 1;
  const w = { passo:0, n, exps:[{nome:'',mod:2}], base:null, manual:false, ataqueEditado:false, danoDado:'', danoTipo:'fís', todasHab:false };
  npcAplicarPreset(w);
  n.ataque.nome = 'Ataque';
  return w;
}
App.npcwAbrir = ()=>{ state.criando='npc-wizard'; state.npcWiz = npcWizNovo(); render(); };
App.npcwCancelar = ()=>{ limparRascunhoNPC(); state.criando=null; state.npcWiz=null; render(); };
App.npcwPasso = (p)=>{ state.npcWiz.passo = p; render(); };
App.npcwCampo = (c,v)=>{ state.npcWiz.n[c] = v; };
App.npcwNum = (c,v)=>{ state.npcWiz.n[c] = Number(v)||0; state.npcWiz.manual = true; };
App.npcwNumR = (c,v)=>{ state.npcWiz.n[c] = Math.max(0, (Number(state.npcWiz.n[c])||0) + v); state.npcWiz.manual = true; render(); };
App.npcwTipo = (t)=>{ const w=state.npcWiz; w.n.papel = t; w.base=null; if(!w.manual) npcAplicarPreset(w); render(); };
App.npcwPatamar = (p)=>{ const w=state.npcWiz; w.n.patamar = p; if(!w.manual) npcAplicarPreset(w); render(); };
App.npcwSugerir = ()=>{ const w=state.npcWiz; w.ataqueEditado=false; npcAplicarPreset(w); render(); };
App.npcwBase = (i)=>{
  const w = state.npcWiz;
  if(i==='' || i===null || i===undefined){ w.base=null; render(); return; }
  const mon = BESTIARIO[Number(i)]; if(!mon) return;
  const n = w.n;
  n.nome = mon.nome; n.papel = mon.tipo; n.patamar = mon.patamar; n.descricao = mon.descricao;
  n.dificuldade = mon.dificuldade; n.limiarMaior = mon.limiarMaior||0; n.limiarGrave = mon.limiarGrave||0;
  n.pvMax = mon.pv; n.pfMax = mon.pf; n.motivacoes = mon.motivacoes;
  n.ataque = { nome:mon.ataque.nome, atr:mon.ataque.atr, alcance:mon.ataque.alcance, dano:mon.ataque.dano };
  n.habilidades = mon.habilidades.map(h=>({ id:uid(), nome:h.nome, tipo:h.tipo, custo:'', texto:h.texto }));
  w.exps = (mon.experiencia||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{ const m=s.match(/^(.*?)\s*([+−-]\d+)\s*$/); return m? {nome:m[1], mod:Number(m[2].replace('−','-'))} : {nome:s, mod:2}; });
  if(!w.exps.length) w.exps=[{nome:'',mod:2}];
  w.base = Number(i); w.manual = true; w.ataqueEditado = true;
  const md = mon.ataque.dano.match(/^(.*?)\s+(fís|mág)/); w.danoDado = md? md[1] : mon.ataque.dano; w.danoTipo = md? md[2] : 'fís';
  render();
};
/* Mudar o patamar de um monstro do bestiário aplica a tabela "Improvisando Monstros" (p.208). */
App.npcwReajustarPatamar = (p)=>{
  const w = state.npcWiz, n = w.n; n.patamar = p;
  const pr = npcPreset(n.papel, p);
  n.dificuldade = pr.dificuldade; n.limiarMaior = pr.limiarMaior; n.limiarGrave = pr.limiarGrave; n.ataque.atr = npcMod(pr.atkMod);
  w.danoDado = pr.dano; n.ataque.dano = pr.dano + ' ' + w.danoTipo;
  render();
};
App.npcwAtaque = (c,v)=>{ const w=state.npcWiz; w.n.ataque[c]=v; w.ataqueEditado = true; if(c==='dano'){ const md=v.match(/^(.*?)\s+(fís|mág)/); w.danoDado = md? md[1] : v; } };
App.npcwAlcance = (v)=>{ const w=state.npcWiz; w.n.ataque.alcance=v; w.ataqueEditado=true; render(); };
App.npcwDanoTipo = (t)=>{ const w=state.npcWiz; w.danoTipo=t; w.n.ataque.dano = (w.danoDado||'') + ' ' + t; w.ataqueEditado=true; render(); };
App.npcwDanoOpt = (i)=>{ const w=state.npcWiz; const d = NPC_TABELA[w.n.patamar].dado[i]; w.danoDado=d; w.n.ataque.dano = d+' '+w.danoTipo; w.ataqueEditado=true; render(); };
App.npcwExp = (i,c,v)=>{ const e=state.npcWiz.exps[i]; if(e) e[c] = c==='mod'? (Number(v)||0) : v; };
App.npcwExpAdd = ()=>{ const w=state.npcWiz; if(w.exps.length<4){ w.exps.push({nome:'',mod:2}); render(); } };
App.npcwExpRem = (i)=>{ const w=state.npcWiz; w.exps.splice(i,1); if(!w.exps.length) w.exps=[{nome:'',mod:2}]; render(); };
App.npcwExpSug = (i)=>{ const w=state.npcWiz; const nome = NPC_EXP_SUGESTOES[i]; const vazio = w.exps.find(e=>!e.nome); if(vazio) vazio.nome=nome; else if(w.exps.length<4) w.exps.push({nome,mod:2}); render(); };
App.npcwMotivSug = (i)=>{ const w=state.npcWiz, t = NPC_MOTIV_SUGESTOES[i]; const lista = (w.n.motivacoes||'').split(',').map(s=>s.trim()).filter(Boolean); const k = lista.indexOf(t); if(k>=0) lista.splice(k,1); else lista.push(t); w.n.motivacoes = lista.join(', '); render(); };
App.npcwHabModelo = (i)=>{ const w=state.npcWiz; const m = NPC_HAB_MODELOS[i]; if(m){ w.n.habilidades.push(npcHabDoModelo(m, w.n.patamar, w.n.papel)); render(); } };
App.npcwHabCustom = ()=>{ state.npcWiz.n.habilidades.push({ id:uid(), nome:'', tipo:'ação', custo:'', texto:'' }); render(); };
App.npcwHabCampo = (i,c,v)=>{ const h=state.npcWiz.n.habilidades[i]; if(h) h[c]=v; };
App.npcwHabTipo = (i,v)=>{ const h=state.npcWiz.n.habilidades[i]; if(h){ h.tipo=v; render(); } };
App.npcwHabRem = (i)=>{ state.npcWiz.n.habilidades.splice(i,1); render(); };
App.npcwTodasHab = ()=>{ state.npcWiz.todasHab = !state.npcWiz.todasHab; render(); };
App.npcwFinalizar = ()=>{
  const w = state.npcWiz; if(!w) return;
  try{
    const n = {...w.n};
    n.nome = (n.nome||'').trim() || 'Monstro sem nome';
    n.experiencia = w.exps.filter(e=>e.nome && e.nome.trim()).map(e=>e.nome.trim()+' '+npcMod(e.mod)).join(', ');
    n.habilidades = (n.habilidades||[]).filter(h=>h.nome || h.texto);
    n.pv = 0; n.pf = 0;
    limparRascunhoNPC();
    state.criando = null; state.npcWiz = null; state.abertaId = n.id; state.tableTab = 'npcs';
    salvarUmaFicha(n, false).catch(()=>{});
  }catch(e){ console.error(e); alert('Não foi possível concluir a criação: '+(e && e.message || e)+'\nSeu progresso foi mantido.'); }
};
/* rascunho (sobrevive ao F5) */
function chaveRascunhoNPC(){ return state.usuario && state.campanha ? 'pp:npcwiz:'+state.usuario.nome+':'+state.campanha.codigo : null; }
function guardarRascunhoNPC(){ try{ const k=chaveRascunhoNPC(); if(k && state.criando==='npc-wizard' && state.npcWiz) localStorage.setItem(k, JSON.stringify(state.npcWiz)); }catch(e){} }
function limparRascunhoNPC(){ try{ const k=chaveRascunhoNPC(); if(k) localStorage.removeItem(k); }catch(e){} }
function restaurarRascunhoNPC(){
  try{
    const k=chaveRascunhoNPC(); if(!k) return false;
    if(state.campanha.mestre !== state.usuario.nome) return false;
    const raw = localStorage.getItem(k); if(!raw) return false;
    const w = JSON.parse(raw); if(!w || !w.n) return false;
    state.npcWiz = w; state.criando='npc-wizard'; state.tableTab='npcs'; return true;
  }catch(e){ return false; }
}

      <div class="field"><label>Alcance</label><div class="row" style="flex-wrap:wrap;">${NPC_ALCANCES.map(a=>`<button class="btn btn-sm ${n.ataque.alcance===a?'btn-gold':''}" onclick="App.npcwAlcance('${a}')">${a}</button>`).join('')}</div></div>

      <div class="field"><label>Dano</label>
        ${n.papel==='Lacaio'? `<div class="muted" style="font-size:12px;margin-bottom:6px;">Lacaios causam dano fixo (entre 1 e 5 no livro).</div>`
          : `<div class="row" style="flex-wrap:wrap;margin-bottom:6px;">${['mínimo da tabela','médio','máximo da tabela'].map((r,i)=>`<button class="btn btn-sm ${w.danoDado===dados[i]?'btn-gold':''}" onclick="App.npcwDanoOpt(${i})">${dados[i]} <span style="opacity:.7;font-size:12.5px;">${r}</span></button>`).join('')}</div>`}
        <input value="${esc(n.ataque.dano)}" oninput="App.npcwAtaque('dano',this.value)" placeholder="Ex.: 1d8+2 fís">
        <div class="muted" style="font-size:12.5px;margin-top:4px;">Faixa do livro para o ${n.patamar}º patamar: ${dados[0]} até ${dados[2]}. ${A.dano===2?'Este tipo costuma ficar na faixa alta.':A.dano===0?'Este tipo costuma ficar na faixa baixa.':'Este tipo costuma ficar na faixa média.'}</div>
      </div>
    </div></div>`;
  } else if(w.passo===3){
    corpo = `<div class="panel"><div class="panel-head"><h3>Passo 4 — Experiências e motivações</h3></div><div class="panel-body">
      ${dica('Monstros têm poucas Experiências, mais amplas que as dos jogadores. O mestre pode gastar 1 Ponto de Medo para somar o bônus à Dificuldade, a um ataque ou a um teste de reação (livro, p. 194).')}
      <div class="stack">${w.exps.map((e,i)=>`<div class="row" style="gap:8px;align-items:flex-end;"><div class="field" style="flex:1;margin:0;"><label>Experiência ${i+1}</label><input value="${esc(e.nome)}" oninput="App.npcwExp(${i},'nome',this.value)"></div><div class="field" style="width:80px;margin:0;"><label>Bônus</label><input type="number" value="${e.mod}" oninput="App.npcwExp(${i},'mod',this.value)"></div><button class="btn btn-sm btn-danger" onclick="App.npcwExpRem(${i})">✕</button></div>`).join('')}</div>
      ${w.exps.length<4? `<div style="margin-top:8px;"><button class="btn btn-sm" onclick="App.npcwExpAdd()">+ Experiência</button></div>`:''}

    const falta = (n.papel==='Horda' && !tem('Horda')) ? 'Hordas precisam da passiva Horda (X), que reduz o dano pela metade dos PV.' : (n.papel==='Lacaio' && !tem('Lacaio')) ? 'Lacaios precisam da passiva Lacaio (X) e, normalmente, de Ataque em Grupo.' : '';

        <div style="color:var(--hope);font-size:13px;">${esc(n.papel)} (${n.patamar}º patamar)</div>
        <div class="muted" style="font-size:13px;font-style:italic;margin:4px 0;">${esc(n.descricao)}</div>
        ${n.motivacoes? `<div style="font-size:13px;"><b>Motivações e táticas:</b> ${esc(n.motivacoes)}</div>`:''}
        <div style="font-size:13px;margin-top:8px;"><b>Dificuldade:</b> ${n.dificuldade} | <b>Limiares:</b> ${n.limiarMaior? n.limiarMaior+(n.limiarGrave?'/'+n.limiarGrave:''):'nenhum'} | <b>${n.pvMax} PV</b> | <b>${n.pfMax} PF</b></div>
        <div style="font-size:13px;"><b>ATQ:</b> ${esc(n.ataque.atr)} | ${esc(n.ataque.nome)}: ${esc(n.ataque.alcance)} | ${esc(n.ataque.dano)}</div>
        ${exp? `<div style="font-size:13px;"><b>Experiência:</b> ${esc(exp)}</div>`:''}
        ${n.habilidades.length? `<div style="margin-top:10px;font-size:12px;letter-spacing:.1em;color:var(--muted);">HABILIDADES</div>${n.habilidades.map(h=>`<div style="font-size:13px;margin-top:4px;"><b>${esc(h.nome)}</b> (${esc(h.tipo)}${h.custo?' · '+esc(h.custo):''}): ${esc(h.texto)}</div>`).join('')}`:''}
      </div>
    </div></div>`;
  }
  const ultimo = w.passo === NPC_PASSOS.length-1;
  const rodape = `<div class="between"><button class="btn btn-ghost" onclick="${w.passo===0?'App.npcwCancelar()':`App.npcwPasso(${w.passo-1})`}">Voltar</button>
    ${ultimo? `<button class="btn btn-gold" onclick="App.npcwFinalizar()">Criar monstro</button>` : `<button class="btn btn-gold" onclick="App.npcwPasso(${w.passo+1})">Continuar</button>`}</div>`;
  return `<div style="margin-bottom:20px;"><button class="btn btn-sm btn-ghost" onclick="App.npcwCancelar()">← Cancelar</button></div>${cab}${corpo}${rodape}`;
}

  { nome:'Reviravolta', tipo:'reação', texto:'Quando um personagem rolar com Medo durante uma ação importante, descreva uma complicação do ambiente que muda a cena (um obstáculo, um recém-chegado, uma saída bloqueada).', perg:'Que mudança deixa a cena mais interessante, não apenas mais difícil?' },
  { nome:'Ápice do Ambiente (Medo)', tipo:'ação', custo:'2 Medo', texto:'Gaste 2 Pontos de Medo para liberar o poder máximo do local. Cada personagem deve fazer um teste de reação (atributo à sua escolha). Quem falhar sofre {D} pontos de dano e marca 1 Ponto de Fadiga; quem passar sofre metade do dano. Use no momento mais impactante da cena.', perg:'O que o grupo faz para sobreviver a isso? O que muda no local depois?' }

function ambHabDoModelo(m, pat){
  const sub = s => s.replace(/\{D\}/g, AMB_TABELA[pat].d).replace(/\{P\}/g, pat).replace(/\{DIF\}/g, AMB_TABELA[pat].dif);
  return { id:uid(), nome:m.nome, tipo:m.tipo, custo:m.custo||'', texto:sub(m.texto), perguntas:m.perg||'' };
}
/* ---- Biblioteca ---- */
App.abrirAmbientes = ()=>{ state.mostrandoAmbientes = true; state.ambBibPatamar = 1; state.ambBibBusca = ''; state.ambBibTipo = 'Todos'; render(); };
App.fecharAmbientes = ()=>{ state.mostrandoAmbientes = false; render(); };
App.ambBibPatamar = (p)=>{ state.ambBibPatamar = p; render(); };
App.ambBibTipo = (t)=>{ state.ambBibTipo = t; render(); };
App.ambBibBuscar = (v)=>{ state.ambBibBusca = v; render(); };
function ambienteDaBiblioteca(m){
  const a = novoAmbiente();
  a.nome = m.nome; a.ambienteTipo = m.ambienteTipo; a.patamar = m.patamar; a.descricao = m.descricao;
  a.impulsos = m.impulsos||''; a.dificuldade = m.dificuldade; a.difNota = m.difNota||'';
  a.adversariosSugeridos = m.adversariosSugeridos||'';
  a.habilidades = (m.habilidades||[]).map(h=>({ id:uid(), nome:h.nome, tipo:h.tipo, custo:h.custo||'', texto:h.texto, perguntas:h.perguntas||'' }));
  return a;
}
App.ambBibAdicionar = async (idx)=>{
  const m = AMBIENTES_HF[idx]; if(!m) return;
  const a = ambienteDaBiblioteca(m);
  try{ await salvarUmaFicha(a, true); }catch(e){ console.error(e); }
  state.mostrandoAmbientes = false; state.abertaId = a.id; state.tableTab = 'ambientes';
  render();
};
function AmbientesBibliotecaModal(){

    .filter(x=> tipo==='Todos' || x.m.ambienteTipo===tipo)
    .filter(x=> !busca || x.m.nome.toLowerCase().includes(busca) || (x.m.nomeOriginal||'').toLowerCase().includes(busca) || x.m.descricao.toLowerCase().includes(busca));

    <h3 style="font-family:var(--serif);font-size:1.4rem;margin:0 0 6px;">${icon('mapa',22)} Biblioteca de Ambientes</h3>
    <p class="muted" style="font-size:.85rem;margin:0 0 16px;">${AMBIENTES_HF.length} ambientes de Esperança &amp; Medo, prontos para a mesa. Eles são copiados para a sua campanha e podem ser editados.</p>
    <div class="row" style="margin-bottom:10px;">${[1,2,3,4].map(p=>`<button class="btn btn-sm ${pat===p?'':'btn-ghost'}" onclick="App.ambBibPatamar(${p})">${p}º patamar</button>`).join('')}</div>
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;">${['Todos',...TIPOS_AMBIENTE].map(t=>`<button class="btn btn-sm ${tipo===t?'':'btn-ghost'}" onclick="App.ambBibTipo('${t}')">${t}</button>`).join('')}</div>
    <input placeholder="Buscar por nome ou descrição..." value="${esc(state.ambBibBusca||'')}" oninput="App.ambBibBuscar(this.value)" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--field);color:var(--parch);margin-bottom:14px;">
    <div style="max-height:420px;overflow-y:auto;">
      ${itens.length===0? '<p class="muted">Nenhum ambiente encontrado.</p>' : itens.map(({m,idx})=>`
        <div style="padding:12px 0;border-bottom:1px solid var(--line);">
          <div class="between">
            <span style="font-size:1rem;color:var(--parch);"><strong style="font-family:var(--serif);">${esc(m.nome)}</strong>
              <span class="muted" style="font-size:.8rem;"> · ${esc(m.ambienteTipo)} · ${m.dificuldade? 'Dif. '+m.dificuldade : 'Dif. especial'} · ${m.habilidades.length} habilidades</span></span>
            <button class="btn btn-sm btn-gold" onclick="App.ambBibAdicionar(${idx})">${icon('mais',15)} Adicionar</button>
          </div>
          <div class="muted" style="font-size:.82rem;margin-top:4px;">${esc(m.descricao)}</div>
        </div>`).join('')}
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:16px;"><button class="btn btn-ghost" onclick="App.fecharAmbientes()">Fechar</button></div>
  </div></div>`;
}
/* ---- Assistente ---- */
function ambWizNovo(){
  const a = novoAmbiente(); a.nome=''; a.ambienteTipo='Exploração'; a.patamar=1; a.dificuldade = AMB_TABELA[1].dif; a.impulsos='';
  return { passo:0, a, base:null, difEditada:false };
}
App.ambwAbrir = ()=>{ state.criando='amb-wizard'; state.ambWiz = ambWizNovo(); render(); };
App.ambwCancelar = ()=>{ limparRascunhoAmb(); state.criando=null; state.ambWiz=null; render(); };
App.ambwPasso = (p)=>{ state.ambWiz.passo = p; render(); };
App.ambwCampo = (c,v)=>{ state.ambWiz.a[c] = v; };
App.ambwTipo = (t)=>{ state.ambWiz.a.ambienteTipo = t; render(); };
App.ambwPatamar = (p)=>{ const w=state.ambWiz; w.a.patamar = p; if(!w.difEditada) w.a.dificuldade = AMB_TABELA[p].dif; render(); };
App.ambwDif = (v)=>{ const w=state.ambWiz; w.a.dificuldade = Number(v)||0; w.difEditada = true; };
App.ambwDifSug = ()=>{ const w=state.ambWiz; w.a.dificuldade = AMB_TABELA[w.a.patamar].dif; w.difEditada=false; render(); };
App.ambwBase = (i)=>{
  const w = state.ambWiz;
  if(i===''||i===null||i===undefined){ w.base=null; render(); return; }
  const m = AMBIENTES_HF[Number(i)]; if(!m) return;
  const a = ambienteDaBiblioteca(m); a.id = w.a.id;
  w.a = a; w.base = Number(i); w.difEditada = true; render();
};
App.ambwAdv = (nome)=>{ const w=state.ambWiz; const l=(w.a.adversariosSugeridos||'').split(',').map(s=>s.trim()).filter(Boolean); const k=l.indexOf(nome); if(k>=0) l.splice(k,1); else l.push(nome); w.a.adversariosSugeridos = l.join(', '); render(); };
App.ambwHabModelo = (i)=>{ const w=state.ambWiz, m=AMB_HAB_MODELOS[i]; if(m){ w.a.habilidades.push(ambHabDoModelo(m, w.a.patamar)); render(); } };
App.ambwHabCustom = ()=>{ state.ambWiz.a.habilidades.push({ id:uid(), nome:'', tipo:'ação', custo:'', texto:'', perguntas:'' }); render(); };
App.ambwHabCampo = (i,c,v)=>{ const h=state.ambWiz.a.habilidades[i]; if(h) h[c]=v; };
App.ambwHabTipo = (i,v)=>{ const h=state.ambWiz.a.habilidades[i]; if(h){ h.tipo=v; render(); } };
App.ambwHabRem = (i)=>{ state.ambWiz.a.habilidades.splice(i,1); render(); };
App.ambwFinalizar = ()=>{
  const w = state.ambWiz; if(!w) return;
  try{
    const a = {...w.a};
    a.nome = (a.nome||'').trim() || 'Ambiente sem nome';
    a.habilidades = (a.habilidades||[]).filter(h=>h.nome || h.texto);
    limparRascunhoAmb();
    state.criando = null; state.ambWiz = null; state.abertaId = a.id; state.tableTab = 'ambientes';
    salvarUmaFicha(a, false).catch(()=>{});
  }catch(e){ console.error(e); alert('Não foi possível concluir a criação: '+(e && e.message || e)+'\nSeu progresso foi mantido.'); }
};
function chaveRascunhoAmb(){ return state.usuario && state.campanha ? 'pp:ambwiz:'+state.usuario.nome+':'+state.campanha.codigo : null; }
function guardarRascunhoAmb(){ try{ const k=chaveRascunhoAmb(); if(k && state.criando==='amb-wizard' && state.ambWiz) localStorage.setItem(k, JSON.stringify(state.ambWiz)); }catch(e){} }
function limparRascunhoAmb(){ try{ const k=chaveRascunhoAmb(); if(k) localStorage.removeItem(k); }catch(e){} }
function restaurarRascunhoAmb(){
  try{
    const k=chaveRascunhoAmb(); if(!k) return false;
    if(state.campanha.mestre !== state.usuario.nome) return false;
    const raw = localStorage.getItem(k); if(!raw) return false;
    const w = JSON.parse(raw); if(!w || !w.a) return false;
    state.ambWiz = w; state.criando='amb-wizard'; state.tableTab='ambientes'; return true;
  }catch(e){ return false; }
}

        <div class="muted" style="font-size:13px;font-style:italic;margin:4px 0;">${esc(a.descricao)}</div>

        <div style="font-size:13px;margin-top:6px;"><b>Dificuldade:</b> ${a.dificuldade||'—'}</div>
        ${a.adversariosSugeridos? `<div style="font-size:13px;"><b>Monstros:</b> ${esc(a.adversariosSugeridos)}</div>`:''}
        ${a.habilidades.length? `<div style="margin-top:10px;font-size:12px;letter-spacing:.1em;color:var(--muted);">HABILIDADES</div>${a.habilidades.map(h=>`<div style="font-size:13px;margin-top:6px;"><b>${esc(h.nome)}</b> (${esc(h.tipo)}${h.custo?' · '+esc(h.custo):''}): ${esc(h.texto)}${h.perguntas? `<div class="muted" style="font-style:italic;font-size:12px;">${esc(h.perguntas)}</div>`:''}</div>`).join('')}`:''}
      </div>
    </div></div>`;
  }
  const ultimo = w.passo === AMB_PASSOS.length-1;
  const rodape = `<div class="between"><button class="btn btn-ghost" onclick="${w.passo===0?'App.ambwCancelar()':`App.ambwPasso(${w.passo-1})`}">Voltar</button>
    ${ultimo? `<button class="btn btn-gold" onclick="App.ambwFinalizar()">Criar ambiente</button>` : `<button class="btn btn-gold" onclick="App.ambwPasso(${w.passo+1})">Continuar</button>`}</div>`;
  return `<div style="margin-bottom:20px;"><button class="btn btn-sm btn-ghost" onclick="App.ambwCancelar()">← Cancelar</button></div>${cab}${corpo}${rodape}`;
}
App.ambwRender = ()=>render();

function WizardHTML(){

      <div class="grid g2">
        <div class="field"><label>Nome</label><input value="${esc(f.nome)}" oninput="App.wizCampo('nome',this.value)"></div>
        <div class="field"><label>Gênero</label><input value="${esc(f.genero)}" oninput="App.wizCampo('genero',this.value)"></div>
      </div>
      <div class="grid g2" style="margin-top:12px;">
        <div class="field"><label>Ancestralidade</label>
          ${f.ancestralidadeMista ? `
            <div class="row" style="gap:6px;">
              <input value="${esc(f.ancestralidade)}" style="flex:1;" disabled>
              <button class="btn btn-sm btn-ghost" type="button" onclick="App.abrirAncestralidadeMista('wizard')">Editar</button>
            </div>
          ` : `
            <select onchange="App.wizAncestralidade(this.value)">
              <option value="">—</option>
              ${ANCESTRALIDADES.map(a=>`<option value="${a}" ${f.ancestralidade===a?'selected':''}>${a}</option>`).join('')}
              <option value="__mista__">✦ Ancestralidade Mista…</option>
            </select>
          `}
        </div>
        <div class="field"><label>Comunidade</label>
          <select onchange="App.wizComunidade(this.value)">
            <option value="">—</option>
            ${COMUNIDADES.map(a=>`<option value="${a}" ${f.comunidade===a?'selected':''}>${a}</option>`).join('')}
          </select>
        </div>
      </div>
      ${ancHabs? `<div style="margin-top:16px;">${habListHTML(ancHabs)}</div>` : ''}
      ${com? `<div style="margin-top:12px;">${habListHTML([com.habilidade])}</div>` : ''}
    </div></div>`;
    podeAvancar = !!(f.ancestralidade && f.comunidade);

  } else if(w.passo===2){
    const valido = atributosValidos(f.atributos);
    corpo = `<div class="panel"><div class="panel-head"><h3>Passo 3 — Distribua seus atributos</h3></div><div class="panel-body">
      <p class="muted" style="margin-top:0;font-size:13px;">Distribua +2, +1, +1, +0, +0 e −1 entre os atributos, cada valor usado uma vez. Os valores sugeridos para ${f.classe||'a classe'} já estão preenchidos.</p>
      <div class="grid g3">
        ${ATRIBUTOS.map(a=>`<div class="field"><label>${a.n}</label>
          <select onchange="App.wizAtributo('${a.k}',this.value)">
            ${[2,1,0,-1].map(v=>`<option value="${v}" ${f.atributos[a.k]===v?'selected':''}>${sgn(v)}</option>`).join('')}
          </select></div>`).join('')}
      </div>
      <p style="margin:14px 0 0;font-size:13px;color:${valido?'var(--seal)':'#E39B9B'};">${valido? '✓ Distribuição válida.' : '✗ Ainda falta ajustar: use +2, +1, +1, 0, 0 e −1, cada um uma vez.'}</p>
    </div></div>`;
    podeAvancar = atributosValidos(f.atributos);

  } else if(w.passo===3){
    const partes = c? c.itens.split(/ ou /i) : [];
    const equipAba = state.wizEquipAba || 'fisicas';
    const equipAbas = [
      ['fisicas','Armas Físicas'],['magicas','Armas Mágicas'],['secundarias','Secundárias'],['armaduras','Armaduras']
    ];
    const categoriaKey = { fisicas:'armasPrimariasFisicas', magicas:'armasPrimariasMagicas', secundarias:'armasSecundarias', armaduras:'armaduras' }[equipAba];
    const equipItens = EQUIPAMENTO_LOJA[categoriaKey].map((it,i)=>({it,i})).filter(x=>x.it[0]===1);
    const ehArmaAba = equipAba!=='armaduras';
    corpo = `<div class="panel"><div class="panel-head"><h3>Passo 4 — Escolha seu equipamento</h3></div><div class="panel-body">
      ${ c? `<div class="stack" style="font-size:14px;">
        <div class="grid g3" style="margin-bottom:4px;">
          <div class="attrbox" style="text-align:left;padding:10px 12px;">
            <div class="muted" style="font-size:.78rem;">Arma principal</div>
            <div style="color:var(--parch);font-size:.95rem;">${f.arma1.nome? esc(f.arma1.nome) : '— nenhuma —'}</div>
          </div>
          <div class="attrbox" style="text-align:left;padding:10px 12px;">
            <div class="muted" style="font-size:.78rem;">Arma secundária</div>
            <div style="color:var(--parch);font-size:.95rem;">${f.arma2.nome? esc(f.arma2.nome) : '— nenhuma —'}</div>
          </div>
          <div class="attrbox" style="text-align:left;padding:10px 12px;">
            <div class="muted" style="font-size:.78rem;">Armadura</div>
            <div style="color:var(--parch);font-size:.95rem;">${f.armaduraAtiva.nome? esc(f.armaduraAtiva.nome) : '— nenhuma —'}</div>
          </div>
        </div>
        <p class="muted" style="font-size:.85rem;margin:0;">Escolha entre qualquer arma ou armadura de 1º patamar — não precisa ser a sugerida pela sua classe.</p>
        <div class="tabs" style="margin:4px 0 10px;">
          ${equipAbas.map(([k,n])=>`<button class="tab ${equipAba===k?'active':''}" onclick="App.wizSetEquipAba('${k}')">${n}</button>`).join('')}
        </div>
        <div style="max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field);">
          ${ehArmaAba
            ? equipItens.map(({it,i})=>{
                const [pat,nome,atributo,alcance,dano,empunhadura,habilidade] = it;
                return `<div style="padding:8px 0;border-bottom:1px solid var(--line);">
                  <div class="between">
                    <span style="font-size:.95rem;color:var(--parch);"><strong>${esc(nome)}</strong> <span class="muted" style="font-size:.8rem;">· ${esc(atributo)} · ${esc(alcance)} · ${esc(dano)} · ${esc(empunhadura)}</span></span>
                    <div class="row" style="gap:6px;">
                      <button class="btn btn-sm btn-gold" onclick="App.wizEquiparArma('${categoriaKey}',${i},'arma1')">Principal</button>
                      <button class="btn btn-sm btn-ghost" onclick="App.wizEquiparArma('${categoriaKey}',${i},'arma2')">Secundária</button>
                    </div>
                  </div>
                  ${habilidade? `<div class="muted" style="font-size:.8rem;margin-top:4px;">${esc(habilidade)}</div>`:''}
                </div>`;
              }).join('')
            : equipItens.map(({it,i})=>{
                const [pat,nome,limiares,base,habilidade] = it;
                return `<div style="padding:8px 0;border-bottom:1px solid var(--line);">
                  <div class="between">
                    <span style="font-size:.95rem;color:var(--parch);"><strong>${esc(nome)}</strong> <span class="muted" style="font-size:.8rem;">· limiares ${esc(limiares)} · armadura base ${base}</span></span>
                    <button class="btn btn-sm btn-gold" onclick="App.wizEquiparArmadura(${i})">Equipar</button>
                  </div>
                  ${habilidade? `<div class="muted" style="font-size:.8rem;margin-top:4px;">${esc(habilidade)}</div>`:''}
                </div>`;
              }).join('')}
        </div>
        <p style="margin-top:12px;"><strong style="color:var(--hope);">Poção inicial — escolha uma:</strong></p>
        <div class="row">
          <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;"><input type="radio" name="pocao" ${w.pocao==='vida'?'checked':''} onchange="App.wizPocao('vida')"> Poção de Vida Menor (1d4 PV)</label>
          <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;"><input type="radio" name="pocao" ${w.pocao==='vigor'?'checked':''} onchange="App.wizPocao('vigor')"> Poção de Vigor Menor (1d4 Fadiga)</label>

  } else if(w.passo===5){
    corpo = `<div class="panel"><div class="panel-head"><h3>Passo 6 — Crie suas Experiências</h3></div><div class="panel-body">

  } else if(w.passo===6){

      <span class="muted" style="font-size:12px;">${w.cartasEscolhidas.length}/2 escolhidas</span></div>
