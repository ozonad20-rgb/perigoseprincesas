            <span><strong style="color:var(--parch);font-size:13px;">${esc(cd[0])}</strong> <span class="muted" style="font-size:12.5px;">· ${esc(cd[2])} · custo ${cd[3]}</span>
            <div class="muted" style="font-size:12px;margin-top:2px;">${esc(cd[4])}</div></span>
          </label>`;
        }).join('')}`;
      }).join('')}
    </div></div>`;
    podeAvancar = w.cartasEscolhidas.length===2;

  } else if(w.passo===7){
    const vinc = VINCULOS[f.classe] || [];
    corpo = `<div class="panel"><div class="panel-head"><h3>Passo 8 — Crie seus vínculos</h3></div><div class="panel-body">
      <p class="muted" style="margin-top:0;font-size:13px;">Vínculos são construídos com o resto do grupo à mesa. Use estas perguntas como inspiração para fazer aos outros jogadores, ou anote o que já foi combinado.</p>
      <ul style="margin:0 0 12px;padding-left:18px;font-size:13px;color:var(--muted);">
        ${vinc.map(v=>`<li style="margin-bottom:4px;">${esc(v)}</li>`).join('')}
      </ul>
      <div class="field"><label>Anotações de vínculo</label><textarea rows="4" oninput="App.wizVinculosNotas(this.value)">${esc(f.vinculosNotas)}</textarea></div>
    </div></div>`;
  }

  const rodape = `<div class="between">
    <button class="btn btn-ghost" onclick="${w.passo===0? 'App.cancelarAssistente()' : `App.wizPasso(${w.passo-1})`}">Voltar</button>
    ${ w.passo < passos.length-1
      ? `<button class="btn btn-gold" ${!podeAvancar?'disabled':''} onclick="App.wizPasso(${w.passo+1})">Continuar</button>`
      : `<button class="btn btn-gold" onclick="App.wizFinalizar()">Criar personagem</button>` }
  </div>`;

  return `<div style="margin-bottom:20px;"><button class="btn btn-sm btn-ghost" onclick="App.cancelarAssistente()">← Cancelar</button></div>${cabecalho}${corpo}${rodape}`;
}

      {nome:'Estilhaçar', texto:'Você atinge a nota aguda perfeita de ressonância. Todas as criaturas A Uma Pedrada (exceto você, mas incluindo suas amigas se não estiverem preparadas) sofrem [SOMA] de dano, ou metade se obtiver sucesso em um SALVAMENTO. Qualquer objeto de vidro, cristal ou outro material frágil nesta área racha e estilhaça. Não afeta criaturas que não podem ouvi-la ou objetos cobertos com tecido grosso ou outro material amortecedor.'},
      {nome:'Canções Encantadoras', texto:'Você canta uma bela Balada dedicada a uma única criatura; ela a considera uma amiga por [DADOS] horas; ou faz um enorme Show de Tirar o Fôlego e [SOMA] criaturas devem fazer um SALVAMENTO ou se juntam ao canto, dançam, tocam instrumentos ou se divertem de outra forma por [SOMA] rodadas. Se você ou suas amigas machucarem ou fizerem algo ruim a uma criatura afetada, o efeito termina. Não afeta criaturas que não podem ouvi-la.'},
      {nome:'Canção do Desejo', texto:'Uma vez na vida, você pode rolar 4 Dados de Dom para compor uma canção profundamente sentimental, na qual canta seu desejo mais profundo. Sua Fada Madrinha concede este desejo para você. Isso pode ser algo intangível, como a resolução de um conflito, a remoção de uma Maldição ou Trauma, uma habilidade especial ou algo mais, com a aprovação da Mestra. Se quiser usar esta habilidade outra vez, sua Fada Madrinha pode pedir que você conquiste esse direito por meio de uma missão, um favor ou alguma outra prova do seu merecimento.', dadosFixos:4}],
    acidentes:[

      {nome:'Misturas', texto:'Você conhece as receitas de três misturas e as tem à mão justo quando precisa. Elas podem ser ingeridas ou arremessadas como um Ataque.\nTônico: Acaba com uma Aflição ou cura um ferimento. [DADOS] usos.\nVitríolo: Causa [SOMA] de dano quando respinga. Depois, [DADOS] de dano a cada rodada até ser lavado. Corrói metal instantaneamente.\nAnodina: A criatura cai em um sono pacífico, sem pesadelos. [DADOS] usos.'},
      {nome:'Coma-me, Beba-me', texto:'Você aprende mais duas misturas: um bolinho pequeno e um licor doce. Comer o bolinho faz você dobrar de altura por [SOMA] rodadas; seus PC máximos e seu dano também dobram a duração. O licor faz você encolher até o tamanho de um rato por [SOMA] minutos.'},
      {nome:'Mingau', texto:'Você cria uma receita de mingau especial com um efeito mágico à sua escolha. Isso usa Dados de Dom como uma mistura. Você pode escolher um feitiço da página de magias ou trabalhar com a Mestra para inventar seu próprio efeito.'}],
    acidentes:[

      {n:2, nome:'Infusão Explosiva', texto:'Você e qualquer um Por Perto sofrem d4 de dano.', dano:'d4'},
      {n:3, nome:'Vapores', texto:'Vapores de ervas a atingem. Os Dados de Dom só retornam em um 1–2 até que você Gaste Tempo cozinhando e comendo alguma comida fresca.', drenado:true},

      {n:5, nome:'Mistura Instável', texto:'Um feitiço aleatório acontece além do seu efeito pretendido.', feitico:true},

      {nome:'Companheiro', texto:'Seus poderes de amizade lhe deram um vínculo especial com um pequeno animal à sua escolha. Ele tem 1 PC, mas é astuto e tem vantagem em testes de GRAÇA para evitar ser atingido. Use suas Virtudes como os atributos dele. Companheiros Feridos marcam automaticamente um ponto de Trauma. Se perdê-lo, você pode recrutar um novo companheiro se encontrar um animal amigo adequado. Seu companheiro a ajudará da melhor forma possível em qualquer situação. Além disso, ele pode usar seus Dados de Dom para:\nAjudar: Modificar os Testes de Virtude suas ou de suas amigas em até [SOMA]. Ele precisa razoavelmente ser capaz de ajudar na situação e decidir que está ajudando antes da rolagem.\nLutar: Ele testa DETERMINAÇÃO. Se for bem-sucedido, causa [SOMA] de dano.', recurso:'companheiro'},

      {nome:'Círculo de Proteção', texto:'Desenhe um círculo de até 6 metros de diâmetro no chão com sal, giz ou um material similar. Nomeie uma pessoa específica ou uma categoria de criaturas, por exemplo, "Lorde Godfrey" ou "os mortos-vivos". Essa pessoa ou tipo de criatura não pode passar para dentro ou para fora do círculo por [SOMA] horas.'},

/* ---------------- números derivados da ficha ---------------- */
function ddMaxDe(f){ return Math.max(0, (Number(f.nivel)||1) + (Number(f.ddExtra)||0)); }
function dcMaxDe(f){ return Math.max(0, (Number(f.nivel)||1) + (DOM_ID[f.dom] && DOM_ID[f.dom].dcExtra || 0) + (Number(f.dcExtra)||0)); }
function ddDisp(f){ return Math.max(0, ddMaxDe(f) - (Number(f.ddGastos)||0)); }
function dcDisp(f){ return Math.max(0, dcMaxDe(f) - (Number(f.dcGastos)||0)); }
function slotsUsados(f){ return (f.inventario||[]).reduce((s,i)=> s + (Number(i.slots)||0), 0); }
function sobrecarregada(f){ return slotsUsados(f) > (Number(f.virtudes && f.virtudes.det)||0); }
function armaduraTotal(f){
  let a = 0, corpo = false;
  (f.inventario||[]).forEach(i=>{ if(i.equipado){ a += Number(i.armadura)||0; if(i.tipo==='armadura') corpo = true; } });
  if(f.dom==='agilidade-feerica' && !corpo) a += (Number(f.nivel)>=4? 2 : 1);
  return a + (Number(f.armaduraExtra)||0);
}
function temAfl(f, k){ return (f.condicoes||[]).includes(k); }
function aflDesv(f, vk){
  const a = {det:'cansada', gra:'atordoada', ast:'confusa'}[vk];
  if(temAfl(f, a)) return true;
  if(vk==='det' && sobrecarregada(f)) return true;      // carregar demais deixa Cansada
  return false;
}
function vantLiquida(manual, desv){ const v = (Number(manual)||0) + (desv? -1 : 0); return v>0? 1 : v<0? -1 : 0; }
function testeD20(valor, vant){
  const a = d(20), b = vant? d(20) : null;
  const r = vant>0? Math.min(a,b) : vant<0? Math.max(a,b) : a;
  return {dados: b===null? [a] : [a,b], r};
}
function resultadoD20(r, valor){ return r===1? 'critico' : r===20? 'falha-critica' : (r<=valor? 'sucesso' : 'falha'); }
function efetivoRoll(r){ const aj = (r.ajudas||[]).reduce((s,x)=>s+(Number(x.dado)||0),0); return r.d20 - aj; }
function resultadoRoll(r){
  if(r.d20===1) return 'critico';
  if(r.d20===20) return 'falha-critica';
  return efetivoRoll(r) <= r.valor? 'sucesso' : 'falha';
}
const dadoLados = s=> Number(String(s||'').replace(/[^0-9]/g,'')) || 0;
function subst(txt, soma_, dados){ return String(txt||'').replace(/\[SOMA\]/g, '<b>'+soma_+'</b>').replace(/\[DADOS\]/g, '<b>'+dados+'</b>'); }
function domDaFicha(f){ return DOM_ID[f.dom] || null; }
function nomeDom(f){ return (domDaFicha(f)||{}).nome || '—'; }

/* habilidades liberadas: lista [{dom, idx}] — uma por nível */
function habilidadesLiberadas(f){
  const lista = Array.isArray(f.habs) && f.habs.length? f.habs : [];
  return lista.map((h,i)=>{ const dm = DOM_ID[h.dom]; const hab = dm && dm.especiais[h.idx]; return hab? {slot:i, dom:dm, idx:h.idx, hab} : null; }).filter(Boolean);
}

function garantirCamposFicha(f){
  if(f.tipo==='npc'){
    if(f.pc===undefined) f.pc = Number(f.pvMax)||4;
    if(f.salv===undefined) f.salv = 8;
    if(f.arm===undefined) f.arm = 0;
    if(!Array.isArray(f.ataques)) f.ataques = [];
    if(!Array.isArray(f.feiticos)) f.feiticos = [];
    if(f.dd===undefined) f.dd = 0;
    if(f.texto===undefined) f.texto = '';
    if(f.maldicao===undefined) f.maldicao = '';
    if(!Array.isArray(f.tags)) f.tags = [];
    if(f.retrato===undefined) f.retrato = null;
    return f;
  }
  if(f.tipo!=='pc') return f;
  const base = novaFicha(f.dono);
  Object.keys(base).forEach(k=>{ if(f[k]===undefined) f[k] = base[k]; });
  if(!f.virtudes) f.virtudes = base.virtudes;
  ['det','gra','ast'].forEach(k=>{ if(typeof f.virtudes[k]!=='number') f.virtudes[k] = Number(f.virtudes[k])||10; });
  if(!f.personalidade) f.personalidade = base.personalidade;
  if(f.pc>f.pcMax) f.pc = f.pcMax;
  return f;
}

function mostrarRollToast(r){
  let cor = 'var(--hope)', label = r.rotulo || 'Rolagem', num = r.total;
  if(r.tipo==='virtude' || r.tipo==='ataque' || r.tipo==='defesa'){
    const res = resultadoRoll(r); num = efetivoRoll(r);
    if(r.tipo==='defesa'){ label = res==='critico'||res==='sucesso'? 'Defendeu!' : 'Atingida'; cor = res==='critico'||res==='sucesso'? 'var(--seal)' : 'var(--blood)'; }
    else { label = {critico:'Sucesso crítico!', sucesso:'Sucesso', falha:'Falha', 'falha-critica':'Falha (20)'}[res]; cor = (res==='critico')? 'var(--seal)' : res==='sucesso'? 'var(--hope)' : 'var(--blood)'; }
  } else if(r.tipo==='dom'){ num = r.soma; label = 'Soma dos dados'; cor = (r.acidentes&&r.acidentes.length)? 'var(--fear)' : 'var(--hope)'; }
  else if(r.dano) cor = 'var(--blood)';
  if(r.tipo==='tabela'||r.tipo==='texto'){ return; }
  state.rollToast = { total: num, cor, label, autor: r.autor, rotulo: r.rotulo };
  clearTimeout(rollToastTimer);
  rollToastTimer = setTimeout(()=>{ state.rollToast = null; render(); }, 2800);
}

/* ---------------- condições / ferimentos / dano ---------------- */
function addCond(f, k){ if(!Array.isArray(f.condicoes)) f.condicoes = []; if(!f.condicoes.includes(k)) f.condicoes.push(k); }
function remCond(f, k){ f.condicoes = (f.condicoes||[]).filter(x=>x!==k); }
function tornarFerida(f){ addCond(f, 'derrotado'); }
function somarTrauma(f, n){
  f.trauma = (Number(f.trauma)||0) + (n||1);
  f.semDD = true;                       // Trauma 1+ : sem Dados de Dom por 24 horas (o mestre/jogadora libera depois)
  return f.trauma;
}
function rolarFerimento(f){
  const n = d(8), w = FERIMENTOS[n-1], ef = w.efeito || {};
  const partes = [];
  if(ef.pcMax){ f.pendencias.push({id:uid(), texto:`${w.nome}: +${ef.pcMax} PC máximo quando for curada.`, efeito:{pcMax:ef.pcMax}}); partes.push('+1 PC máx. ao ser curada'); }
  if(ef.afl){ addCond(f, ef.afl); partes.push((AFLICOES[ef.afl]||{}).nome+' aplicada'); }
  if(ef.afl2){ addCond(f, ef.afl2); partes.push((AFLICOES[ef.afl2]||{}).nome+' aplicada'); }
  if(ef.det){ f.pendencias.push({id:uid(), texto:`${w.nome}: depois de três dias, DETERMINAÇÃO +1.`, efeito:{det:1}}); partes.push('DET +1 após 3 dias'); }
  if(ef.pcMaxD4){ f.pendencias.push({id:uid(), texto:`${w.nome}: curada (3 semanas ou magia), role d4 e some aos PC máximos.`, efeito:{pcMaxD4:1}}); partes.push('+d4 PC máx. quando curada'); }
  if(ef.trauma){ somarTrauma(f, 1); partes.push('+1 Trauma'); }
  f.ferimentos.unshift({id:uid(), ts:Date.now(), n, nome:w.nome, texto:w.texto});
  return {n, nome:w.nome, texto:w.texto, resumo:`Ferimento ${n}: ${w.nome}${partes.length? ' ('+partes.join('; ')+')':''}`};
}
/* devolve o que aconteceu, para o registro da rolagem */
function aplicarDanoPC(f, bruto, ignoraArm){
  const arm = ignoraArm? 0 : armaduraTotal(f);
  const liq = Math.max(0, (Number(bruto)||0) - arm);
  const antes = Number(f.pc)||0;
  f.pc = Math.max(0, antes - liq);
  const log = [];
  if(liq > 2*(Number(f.pcMax)||0) && antes>0){
    tornarFerida(f); const t = somarTrauma(f,1);
    log.push(`Dano (${liq}) maior que o dobro dos PC máximos: +1 Trauma automático (agora ${t}).`);
  } else if(antes>0 && f.pc===0){
    tornarFerida(f);
    const w = rolarFerimento(f); log.push('Chegou a 0 PC e ficou Ferida. '+w.resumo+'.');
  }
  return {bruto, arm, liq, antes, depois:f.pc, log};
}
function curarPC(f, n){
  f.pc = Math.min(Number(f.pcMax)||0, (Number(f.pc)||0) + Math.max(0, n));
  if(f.pc>0) remCond(f, 'derrotado');
}
function consumirRefeicao(f){
  const it = (f.inventario||[]).find(i=>i.refeicao && (Number(i.qtd)||0)>0);
  if(!it) return false;
  it.qtd = (Number(it.qtd)||0) - 1;
  if(it.qtd<=0){ f.inventario = f.inventario.filter(x=>x.id!==it.id); }
  return true;
}
function refeicoes(f){ return (f.inventario||[]).filter(i=>i.refeicao).reduce((s,i)=>s+(Number(i.qtd)||0),0); }

/* ---------------- Testes de Virtude ---------------- */
function registrarTeste(f, vk, rotulo, extra){
  const valor = Number(f.virtudes[vk])||0;
  const desv = aflDesv(f, vk);
  const tal = state.talento; state.talento = null;
  const vant = vantLiquida((Number(state.vantagem)||0) + (tal? 1 : 0), desv);
  const t = testeD20(valor, vant);
  if(tal) rotulo += ' · Talento: '+tal;
  const r = Object.assign({id:uid(), ts:Date.now(), tipo:'virtude', autor:f.nome||'Sem nome', fichaId:f.id, rotulo, virtude:vk, valor, vant, desvAfl:desv, dados:t.dados, d20:t.r, ajudas:[]}, extra||{});
  r.resultado = resultadoRoll(r);
  return r;
}
App.rolarVirtude = (fid, vk)=>{
  const f = getFicha(fid); if(!f) return;
  registrarRolagem(registrarTeste(f, vk, `Teste de ${VIRT[vk].n}`));

function VantagemSeletor(){
  const v = state.vantagem||0;
  return `<span class="seg" role="group" aria-label="Vantagem">

App.ajudarDC = (rid)=>{
  const r = state.rolagens.find(x=>x.id===rid); if(!r) return;
  if(resultadoRoll(r)!=='falha'){ return; }
  if(r.tipo==='defesa' && r.aplicado){ alert('O dano já foi aplicado.'); return; }
  const jaAjudou = new Set((r.ajudas||[]).map(a=>a.fichaId));
  const meus = state.fichas.filter(f=>f.tipo==='pc' && f.dono===state.usuario.nome && f.id!==r.fichaId && !jaAjudou.has(f.id) && dcDisp(getFicha(f.id))>0);
  if(!meus.length){ alert('Nenhuma das suas personagens tem Dado Coração livre para ajudar (ou já ajudou nesta rolagem).'); return; }
  let h = meus[0];
  if(meus.length>1){
    const n = prompt('Qual personagem ajuda?\n'+meus.map((x,i)=>`${i+1}. ${x.nome||'Sem nome'}`).join('\n'), '1');
    if(n===null) return; h = meus[Math.max(0,Math.min(meus.length-1,(parseInt(n,10)||1)-1))];
  }
  const f = getFicha(h.id);
  const dado = d(4);
  f.dcGastos = (Number(f.dcGastos)||0)+1;
  r.ajudas = [...(r.ajudas||[]), {fichaId:f.id, nome:f.nome||'Sem nome', dado}];
  r.resultado = resultadoRoll(r);
  salvarUmaFicha(f, true);
  atualizarRolagem(r);
  mostrarRollToast({tipo:'texto', total:dado, rotulo:'Dado Coração', autor:f.nome||'Sem nome', dano:false});
};

function rolarDano(faces, critico){
  const n = critico? 2 : 1, rolls = rolarVarios(n, faces);
  return {faces, rolls, total:soma(rolls), critico:!!critico};
}
App.ppAtacar = (fid, itemId, vkForcada)=>{
  const f = getFicha(fid); if(!f) return;
  const it = itemId==='desarmado'? {id:'desarmado', nome:'Desarmada', dano:'1', alcance:'À Mão'} : (f.inventario||[]).find(i=>i.id===itemId);
  if(!it) return;
  const vk = vkForcada || (it.alcance==='À Mão' || !it.alcance? 'det' : 'gra');
  const r = registrarTeste(f, vk, `Ataque · ${it.nome} (${VIRT[vk].c})`, {tipo:'ataque'});
  if(/sombrinha/i.test(it.nome) && r.d20===20){            // "rerrole qualquer 20 ao atacar"
    const t2 = testeD20(r.valor, r.vant); r.dados = r.dados.concat(['↻'+t2.r]); r.d20 = t2.r; r.resultado = resultadoRoll(r);
  }
  const critLimite = Number(it.critico)||1;
  const crit = r.d20<=critLimite && r.resultado!=='falha-critica';
  if(crit) r.resultado = 'critico';
  if(r.resultado==='critico' || r.resultado==='sucesso'){
    const lados = dadoLados(it.dano);
    if(lados>=2){ const dn = rolarDano(lados, r.resultado==='critico'); r.danoInfo = {texto:it.dano, rolls:dn.rolls, total:dn.total, critico:dn.critico}; }
    else if(String(it.dano).trim()==='1'){ r.danoInfo = {texto:'1', rolls:[1], total:1, critico:false}; }
    if(/vorpal/i.test(it.nome) && crit && r.danoInfo){ r.danoInfo.total = (r.danoInfo.rolls[0]||0)+10; r.danoInfo.nota='Acerto crítico da Lâmina Vorpal: d10+10 (role d6: com 3 ou menos a lâmina se estilhaça).'; }
  }
  registrarRolagem(r);
};

/* ---------------- Dados de Dom ---------------- */
function aplicarAcidente(f, ac){
  const out = [];
  if(ac.afl){ addCond(f, ac.afl); out.push(AFLICOES[ac.afl].nome+' aplicada'); }
  if(ac.dano && ac.dano!=='soma'){ const v = d(dadoLados(ac.dano)); const res = aplicarDanoPC(f, v, true); out.push(`sofreu ${v} de dano (${res.antes}→${res.depois} PC)`); res.log.forEach(l=>out.push(l)); }
  if(ac.dano==='soma'){ out.push('teste GRAÇA: quem falhar sofre o dano da soma (aplique à mão)'); }
  if(ac.drenado){ f.drenado = true; out.push('Dados de Dom drenados: só voltam com 1–2 até cumprir a condição do texto'); }
  if(ac.ferimento){ out.push(rolarFerimento(f).resumo); }
  if(ac.maldicao){ const c = sorteio(MALDICOES); f.maldicoes.push({id:uid(), n:c.n, nome:c.nome, texto:c.texto}); out.push('Maldição aleatória: '+c.nome); }
  if(ac.feitico){ const s = sorteio(FEITICOS); out.push('Feitiço aleatório: '+s.nome+' — '+s.texto.replace(/\[(SOMA|DADOS)\]/g,'?')); }
  return out;
}
function resolverDados(f, n, cfg){
  if(f.semDD){ alert('Trauma: sem Dados de Dom até a mestre liberar (24 horas).'); return; }
  if(n<1){ return; }
  if(n>ddDisp(f)){ alert(`${f.nome||'Esta Princesa'} só tem ${ddDisp(f)} Dado(s) de Dom livre(s).`); return; }
  const dados = rolarVarios(n, 6);
  const cont = {}; dados.forEach(x=>{ cont[x] = (cont[x]||0)+1; });
  const duplas = Object.keys(cont).filter(k=>cont[k]>=2).map(Number).sort((a,b)=>a-b);
  const acs = duplas.map(v=>{ const ac = (cfg.acidentes||[])[v-1]; return ac? {v, ac} : null; }).filter(Boolean);
  const eraDrenada = !!f.drenado;
  const aplicados = acs.map(x=>({v:x.v, nome:x.ac.nome, texto:x.ac.texto, efeitos: aplicarAcidente(f, x.ac)}));
  const lim = f.drenado? 2 : 3;                          // 1–3 voltam (1–2 se estiver drenada); o resto é gasto
  const gastos = dados.filter(x=>x>lim).length;
  f.ddGastos = Math.min(ddMaxDe(f), (Number(f.ddGastos)||0) + gastos);
  const s = soma(dados);
  const r = {id:uid(), ts:Date.now(), tipo:'dom', autor:f.nome||'Sem nome', fichaId:f.id, rotulo:cfg.rotulo, dom:cfg.dom||'', dados, soma:s, gastos, drenada:eraDrenada||!!f.drenado,
    texto:subst(cfg.texto, s, n), acidentes:aplicados};
  salvarUmaFicha(f, true);
  registrarRolagem(r);
}

function ppPips(fid, campo, n, max, cor){
  let h = '';

    h += `<button class="pip ${on?'on':''}" style="background:${on?cor:'transparent'};border-color:${on?cor:'#4F6D63'};" aria-label="${campo} ${i+1} de ${max}" aria-pressed="${on}" onclick="App.ppPip('${fid}','${campo}', ${i}<${n}?${i}:${i+1})"></button>`;

}
App.ppPip = (id, campo, n)=>{
  const f = getFicha(id); n = Number(n)||0;

  else if(campo==='cr'){ /* criaturas: tratado à parte */ }

state.colapsos = (()=>{ try{ return JSON.parse(localStorage.getItem('pp:colapsos')||'{}')||{}; }catch(e){ return {}; } })();
function Colapsavel(fid, id, titulo, corpo, o){
  o = o||{};
  const key = fid+':'+id;
  const aberto = (key in state.colapsos)? !!state.colapsos[key] : !!o.aberto;
  const dom = 'cx_'+String(key).replace(/[^a-z0-9]/gi,'_');
  return `<section class="cx ${o.mini?'mini':''} ${o.cls||''} ${aberto?'aberto':''}">
    <div class="cx-cab">
      <button type="button" class="cx-tog" aria-expanded="${aberto}" aria-controls="${dom}" onclick="App.cxTog(this,'${key}')">
        <span class="cx-seta" aria-hidden="true"></span>${o.icone? `<span class="cx-ic" aria-hidden="true">${icon(o.icone, o.mini?14:18)}</span>`:''}
        <span class="cx-tit">${titulo}</span>${o.resumo? `<span class="cx-res">${o.resumo}</span>`:''}
      </button>${o.extra? `<span class="cx-extra">${o.extra}</span>`:''}
    </div>
    <div class="cx-corpo" id="${dom}" ${aberto?'':'hidden'}>${corpo}</div>
  </section>`;
}
App.cxTog = (btn, key)=>{
  const sec = btn.closest('.cx'); if(!sec) return;
  const abrir = !sec.classList.contains('aberto');
  sec.classList.toggle('aberto', abrir); btn.setAttribute('aria-expanded', abrir);
  const c = sec.querySelector(':scope > .cx-corpo'); if(c) c.hidden = !abrir;
  state.colapsos[key] = abrir;
  try{ localStorage.setItem('pp:colapsos', JSON.stringify(state.colapsos)); }catch(e){}
};
App.cxTodos = (fid, abrir)=>{
  document.querySelectorAll('.ficha-sec > .cx').forEach(sec=>{
    const b = sec.querySelector(':scope > .cx-cab .cx-tog'); if(!b) return;
    const key = (b.getAttribute('onclick').match(/'([^']+)'\)$/)||[])[1];
    if(key && key.startsWith(fid+':') && sec.classList.contains('aberto')!==abrir) App.cxTog(b, key);
  });
};

/* ---------------- Habilidades do Dom ---------------- */
function opcoesDados(disp){ return [1,2,3,4].filter(n=>n<=Math.max(1,disp)).map(n=>`<option value="${n}">${n} dado${n>1?'s':''}</option>`).join(''); }
function DomPanelHTML(f){
  const dm = domDaFicha(f);
  if(!dm) return Colapsavel(f.id,'dom','Dom', `<p class="muted">Esta ficha não tem um Dom escolhido. Edite a identidade (lápis) para escolher.</p>`, {icone:'varinha', aberto:true});
  const lib = habilidadesLiberadas(f), disp = ddDisp(f), bloq = f.semDD;
  const usadas = new Set(lib.map(x=>x.dom.id+':'+x.idx));
  const futuras = [];
  for(let i=lib.length;i<4;i++){ const h = dm.especiais[i]; if(h && !usadas.has(dm.id+':'+i)) futuras.push({n:i+1,h}); }
  const esp = lib.map(x=>{
    const fixo = x.hab.dadosFixos, ok = !bloq && disp>=(fixo||1);
    const ctrl = `${fixo? `<span class="muted cx-fixo">${fixo} dados</span>` : `<select id="ddn_${f.id}_${x.slot}" aria-label="Quantos Dados de Dom" style="${SEL_CSS}">${opcoesDados(disp)}</select>`}
      <button class="btn btn-sm btn-purple" ${ok?'':'disabled'} onclick="App.domUsar('${f.id}',${x.slot})" title="${ok?'':(bloq?'Trauma: sem Dados de Dom':'Sem Dados de Dom livres')}">${icon('dado',14)} Usar</button>`;
    return Colapsavel(f.id,'hab'+x.dom.id+x.slot, `${x.slot+1}. ${esc(x.hab.nome)}`, `<div class="hab-txt">${fmtTxt(x.hab.texto)}</div>`,
      {mini:true, cls:'hab-esp', resumo:`${x.dom.id!==f.dom? esc(x.dom.nome)+' · ':''}nv ${x.slot+1}`, extra:ctrl});
  }).join('') || '<p class="muted">Nenhuma habilidade liberada ainda.</p>';
  const inatas = dm.inatas.map((h,i)=> Colapsavel(f.id,'inata'+dm.id+i, esc(h.nome), `<div class="hab-txt">${esc(h.texto)}</div>`, {mini:true, cls:'hab-inata', resumo:'inata'})).join('');
  const corpo = `
    <p class="muted dom-frase">${esc(dm.frase)}</p>
    <div class="sub-rot">Habilidades especiais <span class="muted">(gastam Dados de Dom)</span></div>${esp}
    ${futuras.length? `<div class="muted" style="font-size:.85rem;margin:6px 0;">Próximas: ${futuras.map(x=>`nível ${x.n} — ${esc(x.h.nome)}`).join(' · ')}</div>`:''}
    <div class="sub-rot">Habilidades inatas</div>${inatas}
    ${Colapsavel(f.id,'acid'+dm.id, 'Tabela de Acidentes (duplas nos Dados de Dom)', dm.acidentes.map(a=>`<div class="acid-lin"><b>${a.n}s — ${esc(a.nome)}:</b> ${esc(a.texto)}</div>`).join(''), {mini:true})}`;
  return Colapsavel(f.id,'dom', `Dom: ${esc(dm.nome)}${f.elemento? ' · '+esc(f.elemento):''}`, corpo, {icone:'varinha', resumo:`${disp}/${ddMaxDe(f)} Dados de Dom`, aberto:true});
}

const PRESETS_INV = (()=>{
  const g = [];
  g.push(['Armas', ARMAS_INICIAIS.map(a=>['arma:'+a.n, `${a.nome} (${a.dano})`])]);
  g.push(['Armaduras', [['arm:leve','Armadura leve (1)'],['arm:pesada','Armadura pesada (2)'],['arm:escudo','Escudo (1)']]]);
  g.push(['Suprimentos', [['sup:tocha','Tochas (4)'],['sup:refeicao','Refeições de viagem (6)'],['sup:saco','Saco de dormir'],['sup:vela','Velas de cera (8)'],['sup:lamparina','Lamparina e óleo (Volumosa)']]]);
  g.push(['Armas encantadas', ARMAS_ENCANTADAS.map(a=>['enc:'+a.n, a.nome])]);
  g.push(['Itens maravilhosos', ITENS_MARAVILHOSOS.map(a=>['mar:'+a.n, a.nome])]);
  return g;
})();
function itemDePreset(v){
  const [t,k] = v.split(':');
  if(t==='arma'){ const a = ARMAS_INICIAIS.find(x=>String(x.n)===k); return itemNovo({nome:a.nome, slots:a.slots, dano:a.dano, alcance:a.alcance, tipo:'arma', armadura:a.armadura||0, critico:a.critico||0, nota:a.nota, equipado:false}); }
  if(t==='arm'){ return k==='leve'? itemNovo({nome:'Armadura leve', slots:1, armadura:1, tipo:'armadura', equipado:true, nota:'Camadas de tecido costuradas, reforçadas com couro.'}) : k==='pesada'? itemNovo({nome:'Armadura pesada', slots:2, armadura:2, tipo:'armadura', equipado:true, nota:'Cota de malha ou placas. Volumosa.'}) : itemNovo({nome:'Escudo', slots:2, armadura:1, tipo:'escudo', equipado:true, nota:'Reduz o dano que você sofre em 1.'}); }
  if(t==='sup'){ return {tocha:itemNovo({nome:'Tochas', slots:1, qtd:4}), refeicao:itemNovo({nome:'Refeições de viagem', slots:1, qtd:6, refeicao:true}), saco:itemNovo({nome:'Saco de dormir', slots:1}), vela:itemNovo({nome:'Velas de cera de abelha', slots:1, qtd:8}), lamparina:itemNovo({nome:'Lamparina e óleo', slots:2})}[k]; }
  if(t==='enc'){ const a = ARMAS_ENCANTADAS.find(x=>String(x.n)===k); return itemNovo({nome:a.nome, slots:a.slots, dano:a.dano, alcance:'À Mão', tipo:'arma', critico:a.critico||0, nota:a.texto}); }
  if(t==='mar'){ const a = ITENS_MARAVILHOSOS.find(x=>String(x.n)===k); return itemNovo({nome:a.nome, slots:a.slots||0, nota:a.texto}); }
  return itemNovo({});
}

App.levelUpRolar = ()=>{
  const lu = state.levelUp, f = getFicha(lu.fichaId);
  const pcD4 = d(4);
  const virt = VIRTUDES.map(v=>{ const r = d(20), val = Number(f.virtudes[v.k])||0; return {k:v.k, r, val, sobe: r>val}; });
  lu.rolou = {pcD4, virt};
  render();
};
function opcoesHabilidade(f){
  const ops = [];
  const prox = id=> (f.habs||[]).filter(h=>h.dom===id).length;
  const proprio = DOM_ID[f.dom];
  if(proprio && prox(proprio.id)<4) ops.push({dom:proprio.id, idx:prox(proprio.id), padrao:true});
  if(f.abundantes) DONS.forEach(dm=>{ if(dm.id!==f.dom && prox(dm.id)<4) ops.push({dom:dm.id, idx:prox(dm.id)}); });
  return ops;
}
App.levelUpEscolha = (v)=>{ state.levelUp.escolha = v; render(); };
App.levelUpConfirmar = ()=>{
  const lu = state.levelUp, f = getFicha(lu.fichaId); if(!lu.rolou) return;
  const ops = opcoesHabilidade(f);
  const esc_ = lu.escolha!=null? ops[lu.escolha] : ops[0];
  f.nivel += 1;
  f.pcMax += lu.rolou.pcD4; f.pc += lu.rolou.pcD4;
  lu.rolou.virt.forEach(v=>{ if(v.sobe) f.virtudes[v.k] += 1; });
  if(esc_) f.habs.push({dom:esc_.dom, idx:esc_.idx});
  state.levelUp = null;
  salvarUmaFicha(f);
};

/* =====================================================================
   P&P — assistente de criação da Princesa
   ===================================================================== */
function wizChave(){ return 'pp:wiz:'+(state.usuario&&state.usuario.nome)+':'+(state.campanha&&state.campanha.codigo); }
function guardarRascunho(){ try{ if(state.ppWiz) localStorage.setItem(wizChave(), JSON.stringify(state.ppWiz)); }catch(e){} }
function limparRascunho(){ try{ localStorage.removeItem(wizChave()); }catch(e){} }
function restaurarRascunho(){
  try{ const s = localStorage.getItem(wizChave()); if(!s) return false; state.ppWiz = JSON.parse(s); state.criando = 'assistente'; return true; }catch(e){ return false; }
}
function guardarRascunhoNPC(){} function limparRascunhoNPC(){} function restaurarRascunhoNPC(){ return false; }
function guardarRascunhoAmb(){} function limparRascunhoAmb(){} function restaurarRascunhoAmb(){ return false; }

function wizNovo(){
  return {nome:'', pronomes:'', dom:'', elemento:'', fada:'', pers:{aparencia:'',perto:'',segredo:'',motivacao:''},
    vd:null, ajuste:null, virt:null, pc:null, roupa:null, arm:null, col:{um:null,dois:null,tres:null}, bonusRoll:null, bonus:null, arma:null, moedas:null, tal:null, talEsc:null};
}
App.abrirAssistente = ()=>{ state.criando='assistente'; state.ppWiz = wizNovo(); state.abertaId = null; state.tableTab='personagens'; render(); window.scrollTo(0,0); };
App.criarFichaZero = ()=>{ const f = novaFicha(state.usuario.nome); salvarUmaFicha(f, true); state.abertaId = f.id; state.editPaineis['ident:'+f.id] = true; render(); };
App.cancelarAssistente = ()=>{ if(!confirm('Descartar a criação desta Princesa?')) return; limparRascunho(); state.criando = null; state.ppWiz = null; render(); };
App.wizSet = (k, v)=>{ state.ppWiz[k] = v; guardarRascunho(); };
App.wizSetR = (k, v)=>{ state.ppWiz[k] = v; guardarRascunho(); render(); };
App.wizPers = (k, v)=>{ state.ppWiz.pers[k] = v; guardarRascunho(); };
App.wizDom = (id)=>{ state.ppWiz.dom = id; guardarRascunho(); render(); };
App.wizRolarVirt = ()=>{
  const w = state.ppWiz; w.vd = [rolarVarios(4,4), rolarVarios(4,4), rolarVarios(4,4)];
  w.virt = {det:soma(w.vd[0]), gra:soma(w.vd[1]), ast:soma(w.vd[2])}; w.ajuste = null; guardarRascunho(); render();
};
App.wizRerrolar = (i)=>{
  const w = state.ppWiz; if(w.ajuste) return;
  const k = ['det','gra','ast'][i]; w.vd[i] = rolarVarios(4,4); w.virt[k] = soma(w.vd[i]); w.ajuste = 'rerrolou '+VIRT[k].n; guardarRascunho(); render();
};
App.wizTrocar = (a, b)=>{
  const w = state.ppWiz; if(w.ajuste || a===b) return;
  const ks = ['det','gra','ast']; const t = w.virt[ks[a]]; w.virt[ks[a]] = w.virt[ks[b]]; w.virt[ks[b]] = t;
  const td = w.vd[a]; w.vd[a] = w.vd[b]; w.vd[b] = td; w.ajuste = 'trocou '+VIRT[ks[a]].c+' com '+VIRT[ks[b]].c; guardarRascunho(); render();
};
App.wizRolarPC = ()=>{ state.ppWiz.pc = {d:d(4)}; state.ppWiz.pc.total = state.ppWiz.pc.d + 4; guardarRascunho(); render(); };
const faixa = (tab, n)=> tab.findIndex(x=>n>=x.de && n<=x.ate);
App.wizRolarEquip = ()=>{
  const w = state.ppWiz;
  w.roupa = d(6)-1;
  w.arm = d(20);
  ['um','dois','tres'].forEach(c=>{ w.col[c] = d(20)-1; });
  w.bonusRoll = d(20); w.bonus = null;
  w.arma = d(12)-1;
  w.moedas = rolarVarios(3,6);
  guardarRascunho(); render();
};
App.wizRolarUm = (que)=>{
  const w = state.ppWiz;
  if(que==='roupa') w.roupa = d(6)-1;
  if(que==='arm') w.arm = d(20);
  if(que==='um'||que==='dois'||que==='tres') w.col[que] = d(20)-1;
  if(que==='bonus'){ w.bonusRoll = d(20); w.bonus = null; }
  if(que==='arma') w.arma = d(12)-1;
  if(que==='moedas') w.moedas = rolarVarios(3,6);
  guardarRascunho(); render();
};
App.wizRolarPersona = ()=>{
  const w = state.ppWiz;
  w.pers = {aparencia: sorteio(PERSONALIDADE.aparencia.itens), perto: sorteio(PERSONALIDADE.quemPerto.itens), segredo: sorteio(PERSONALIDADE.segredo.itens), motivacao: sorteio(PERSONALIDADE.motivacao.itens)};
  w.fada = sorteio(FADAS_MADRINHAS); guardarRascunho(); render();
};
App.wizRolarTalento = ()=>{ const w = state.ppWiz; w.tal = d(20); w.talEsc = null; guardarRascunho(); render(); };
function wizBonusLista(w){
  if(!w.bonusRoll) return [];
  const f = BONUS_COL.find(x=>w.bonusRoll>=x.de && w.bonusRoll<=x.ate); if(!f) return [];
  const cols = f.col==='qualquer'? ['um','dois','tres'] : [f.col];
  const out = [];
  cols.forEach(c=> BOLSA[c].itens.forEach((it,i)=> out.push({v:c+':'+i, nome:it[0], slots:it[1]})));
  return out;
}
function wizItemBolsa(c, i){ const it = BOLSA[c].itens[i]; return it? {nome:it[0], slots:it[1]} : null; }

function wizFaltas(w){
  const f = [];
  if(!(w.nome||'').trim()) f.push('o nome');
  if(!w.dom) f.push('o Dom');
  if(!w.virt) f.push('as Virtudes (4d4 cada)');
  if(!w.pc) f.push('os Pontos Coração (d4+4)');
  return f;
}
App.wizFinalizar = ()=>{
  const w = state.ppWiz; const falt = wizFaltas(w);
  if(falt.length){ alert('Falta definir: '+falt.join(', ')+'.'); return; }
  const dm = DOM_ID[w.dom];
  const f = novaFicha(state.usuario.nome);
  f.nome = w.nome.trim(); f.pronomes = w.pronomes; f.dom = w.dom; f.elemento = w.elemento||''; f.fada = w.fada||'';
  f.virtudes = {...w.virt}; f.pcMax = w.pc.total; f.pc = w.pc.total;
  f.personalidade = {...w.pers};
  f.roupa = w.roupa!=null? `${ROUPAS[w.roupa].nome} — ${ROUPAS[w.roupa].desc}` : '';
  // itens: kit básico + Dom + armadura + bolsa + arma
  KIT_INICIAL.forEach(k=> f.inventario.push(itemNovo({nome:k.nome, slots:k.slots, qtd:k.qtd||0, refeicao:!!k.refeicao, nota:k.nota||''})));
  dm.itens.forEach(i=> f.inventario.push(itemNovo({nome:i.nome, slots:i.slots, dano:i.dano||'', alcance:i.alcance||'', tipo:i.tipo||'', armadura:i.tipo==='escudo'?1:0, equipado:i.tipo==='escudo', nota:i.nota||''})));
  if(w.arm){ const t = ARMADURA_TAB[faixa(ARMADURA_TAB, w.arm)]; (t.itens||[]).forEach(a=> f.inventario.push(itemNovo({nome:a.nome, slots:a.slots, armadura:a.armadura, tipo:a.tipo, equipado:true}))); }
  ['um','dois','tres'].forEach(c=>{ if(w.col[c]!=null){ const it = wizItemBolsa(c, w.col[c]); if(it) f.inventario.push(itemNovo({nome:it.nome, slots:it.slots})); } });
  if(w.bonus){ const [c,i] = w.bonus.split(':'); const it = wizItemBolsa(c, Number(i)); if(it) f.inventario.push(itemNovo({nome:it.nome+' (bônus)', slots:it.slots})); }
  if(w.arma!=null){ const a = ARMAS_INICIAIS[w.arma]; f.inventario.push(itemNovo({nome:a.nome, slots:a.slots, dano:a.dano, alcance:a.alcance, tipo:a.armadura? 'escudo':'arma', armadura:a.armadura||0, critico:a.critico||0, nota:a.nota})); }
  f.moedas = w.moedas? soma(w.moedas) : 0;
  f.talentos = dm.talentos.slice();
  if(w.tal && w.talEsc!=null){ f.talentos.push(TALENTOS_TAB[w.tal-1][w.talEsc]); }
  f.habs = [{dom:dm.id, idx:0}];
  if(dm.id==='amizade-poderosa') f.criaturas.push({id:uid(), nome:'Companheiro', pc:1, pcMax:1});
  limparRascunho(); state.criando = null; state.ppWiz = null; state.abertaId = f.id;
  salvarUmaFicha(f, false).catch(()=>{});
};

    <div class="field" style="margin-top:12px;"><label>Fada Madrinha</label><div class="row"><select style="flex:1" onchange="App.wizSetR('fada',this.value)">${pre('Escolha ou sorteie…')}${FADAS_MADRINHAS.map(t=>`<option ${w.fada===t?'selected':''}>${esc(t)}</option>`).join('')}</select><button class="btn btn-sm" onclick="App.wizSetR('fada', sorteio(FADAS_MADRINHAS))">${icon('dado',14)} d8</button></div></div>

/* =====================================================================
   P&P — combate: iniciativa por faixas, PC, dano com Armadura
   Faixas (maior age primeiro): 3 = Princesas que passaram na iniciativa (e aliadas),
   2 = inimigos, 1 = Princesas que falharam. Dentro da faixa, a ordem é livre (setas).
   ===================================================================== */
function iniFaixa(n){ return n==null? 0 : Math.floor(Number(n)+1e-9); }
function iniRotulo(e){
  if(e.ini==null) return null;
  const fx = iniFaixa(e.ini);
  const base = fx>=3? 'Antes dos inimigos' : fx===2? 'Inimigos' : 'Depois dos inimigos';
  return base + (e.doc && e.doc.ini2 ? ' · 2 Ações' : '');
}
function cbPvAtual(e){
  if(e.tipo==='pc'){ const max = Number(e.ficha.pcMax)||0, at = Math.max(0, Number(e.ficha.pc)||0); return {atual:at, max, marc:max-at}; }
  const max = Number(e.ficha.pc)||0, at = e.doc.pcAtual==null? max : Math.max(0, Number(e.doc.pcAtual)||0);
  return {atual:at, max, marc:max-at};
}
function cbSetIni(e, val, ini2){
  const doc = {...e.doc, id:e.id, ini:val}; if(ini2!==undefined) doc.ini2 = !!ini2;
  if(e.tipo==='pc'){ doc.tipo = 'pc'; doc.fichaId = e.ficha.id; }
  gravarCbt(doc);
}
function ttTokens(){
  if(!state.campanha) return [];
  return cbEntradas().map(e=>{
    const v = cbPvAtual(e), f = e.ficha;
    const foto = ttMiniatura((e.tipo==='pc'? 'f':'c')+e.id, cbFotoDe(e));
    return {
      id: e.id, nome: cbNome(e), tipo: e.tipo==='pc'? 'pj' : (e.doc.aliado? 'aliado' : (e.tipo==='npc'? 'npc' : 'avulso')),
      dono: e.tipo==='pc'? (e.dono||null) : null,
      iniciativa: e.ini, rotuloIni: iniRotulo(e), vida: v.max? {atual:v.atual, max:v.max} : null,
      defesa: e.tipo==='pc'? armaduraTotal(f) : (Number(f.arm)||0),
      foto, condicoes: cbConds(e).slice(),
      subtitulo: e.tipo==='pc'? [nomeDom(f), f.nivel? 'nível '+f.nivel : ''].filter(Boolean).join(' · ') : [f.tags && f.tags[0] && f.tags[0]!=='livro'? f.tags[0] : 'Monstro', 'Salv. '+(f.salv||'—')].join(' · ')
    };
  });
}
function ttAssin(){
  return JSON.stringify(ttTokens().map(t=>[t.id,t.nome,t.tipo,t.dono,t.iniciativa,t.rotuloIni,t.vida,t.defesa,!!t.foto,t.condicoes,t.subtitulo])) + '|' + (state.usuario&&state.usuario.nome) + (ehMestreAtual()?'M':'J');
}

/* ---------- iniciativa ---------- */
App.cbRolarIni = (id)=>{
  const e = cbPorId(id); if(!e) return;
  if(!(ehMestreAtual() || (e.tipo==='pc' && e.dono===state.usuario.nome))) return;
  if(e.tipo!=='pc'){ const fx = e.doc.aliado? 3 : 2; cbSetIni(e, e.ini==null? fx : e.ini, false); return; }
  if(e.ini!=null && !ehMestreAtual() && !confirm('Você já tem iniciativa nesta luta. Rolar de novo?')) return;
  const f = getFicha(e.ficha.id);
  if((f.maldicoes||[]).some(m=>m.n===11)){        // Maldição da Paranoia: age sempre primeiro
    cbSetIni(e, 3, false);
    registrarRolagem({id:uid(), ts:Date.now(), tipo:'texto', autor:f.nome||'Sem nome', rotulo:'Iniciativa', texto:'Paranoia: não pode ser pega de surpresa e age sempre primeiro.', total:0}); return;
  }
  const r = registrarTeste(f, 'ast', 'Iniciativa (ASTÚCIA)');
  const ok = r.resultado==='sucesso' || r.resultado==='critico';
  cbSetIni(e, ok? 3 : 1, r.resultado==='critico');
  r.iniTexto = ok? (r.resultado==='critico'? 'Crítico! Age antes dos inimigos e faz 2 Ações no primeiro turno.' : 'Age antes dos inimigos.') : 'Age depois dos inimigos.';
  registrarRolagem(r);
};
App.cbRolarNPCs = ()=>{
  if(!ehMestreAtual()) return;
  const alvo = cbEntradas().filter(e=>e.tipo!=='pc' && e.ini==null); if(!alvo.length){ return; }
  alvo.forEach(e=>{ const doc = {...e.doc, ini: e.doc.aliado? 3 : 2}; state.combate[doc.id] = doc; DB.set(K.cbt(state.campanha.codigo, doc.id), doc).catch(()=>{}); });
  ttSync(); render();
};
App.cbIniManual = (id)=>{
  if(!ehMestreAtual()) return;
  const e = cbPorId(id); if(!e) return;
  const v = prompt(`Faixa de iniciativa de ${cbNome(e)}:\n3 = antes dos inimigos\n2 = inimigos\n1 = depois dos inimigos\n(vazio para limpar)`, e.ini==null? '' : iniFaixa(e.ini)); if(v===null) return;
  const n = v.trim()===''? null : Number(v.replace(',','.')); if(n!==null && (isNaN(n) || n<0)) return;
  cbSetIni(e, n);
};
App.cbMover = (id, dir)=>{
  const ents = cbEntradas(); const i = ents.findIndex(x=>x.id===id); const j = i+dir;
  if(i<0 || j<0 || j>=ents.length) return;
  const a = ents[i], b = ents[j];
  if(a.ini==null || b.ini==null || iniFaixa(a.ini)!==iniFaixa(b.ini)) return;
  const podeA = ehMestreAtual() || (a.tipo==='pc' && a.dono===state.usuario.nome); if(!podeA) return;
  let ai = a.ini, bi = b.ini;
  if(ai===bi) ai = dir<0? bi+0.05 : bi-0.05; else { const t = ai; ai = bi; bi = t; }
  cbSetIni(a, ai);
  if(bi!==b.ini && (ehMestreAtual() || (b.tipo==='pc' && b.dono===state.usuario.nome))) cbSetIni(b, bi);
};

function cbPipsPP(id, n, max, cor){
  let h = '';
  for(let i=0;i<Math.max(0,max);i++){ const on = i<n; h += `<button class="pip ${on?'on':''}" style="background:${on?cor:'transparent'};border-color:${on?cor:'#4F6D63'};" onclick="App.cbPip('${id}','pc', ${i}<${n}?${i}:${i+1})" aria-label="PC ${i+1} de ${max}" aria-pressed="${on}"></button>`; }
  return `<div class="pips cb-pips">${h}</div>`;
}
function cbLinhaIni(e, vez, mestre){
  const v = cbPvAtual(e);
  const meu = e.tipo==='pc' && e.dono===state.usuario.nome;

  const mostraPV = e.tipo==='pc' || mestre || aliado;
  const fx = iniFaixa(e.ini);
  const sub = e.tipo==='pc'
    ? `${esc(nomeDom(e.ficha))} · ${e.dono? esc(e.dono) : 'mestre'}`
    : ((aliado? 'Aliada' : '') + (mestre? `${aliado? ' · ':''}Salv. ${esc(e.ficha.salv)} · Arm. ${Number(e.ficha.arm)||0}` : ''));
  return `<div class="cb-item ${state.cbSel===e.id?'sel':''} ${vez===e.id?'vez':''} ${pode?'clic':''} tipo-${e.tipo} ${aliado?'aliado':''}" ${pode? `role="button" tabindex="0" onclick="App.cbSelecionar('${e.id}')" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();App.cbSelecionar('${e.id}');}"`:''}>
    <button class="cb-ini-n faixa f${fx}" title="${mestre? 'Editar a faixa de iniciativa':'Iniciativa'}" ${mestre? `onclick="event.stopPropagation();App.cbIniManual('${e.id}')"`:'disabled'}>${e.ini==null? '–' : (fx>=3? 'A' : fx===2? 'I' : 'D')}</button>
    ${cbRetratoHTML(e,false)}
    <div class="cb-info">
      <div class="cb-nome">${vez===e.id? '<span class="cb-seta">▶</span>':''}${esc(cbNome(e))}${e.doc.ini2?' <span class="tagHope" title="Tirou 1 na iniciativa: duas Ações no primeiro turno">×2</span>':''}</div>
      <div class="cb-sub">${sub}${mostraPV && v.max? `${sub?' · ':''}<span class="${v.atual===0?'cb-zero':''}">PC ${v.atual}/${v.max}</span>`:''}${e.ini!=null? ` · <span class="muted">${esc(iniRotulo(e))}</span>`:''}</div>
      ${cbConds(e).length? `<div onclick="event.stopPropagation()" style="margin-top:3px;">${condChipsHTML(e,false)}</div>`:''}
    </div>
    <div class="cb-acoes">
      ${(mestre||meu) && e.ini!=null? `<button class="cb-x" title="Subir na ordem" aria-label="Subir" onclick="event.stopPropagation();App.cbMover('${e.id}',-1)">▲</button><button class="cb-x" title="Descer na ordem" aria-label="Descer" onclick="event.stopPropagation();App.cbMover('${e.id}',1)">▼</button>`:''}
      ${podeRolar? `<button class="icon-btn-roll" title="${e.tipo==='pc'?'Rolar iniciativa (ASTÚCIA)':'Colocar na iniciativa dos inimigos'}" aria-label="Rolar iniciativa" onclick="event.stopPropagation();App.cbRolarIni('${e.id}')">${icon('dado',16)}</button>`:''}
      ${mestre? `<button class="cb-x" title="Tirar do combate" aria-label="Tirar do combate" onclick="event.stopPropagation();App.cbRemover('${e.id}')">✕</button>`:''}
    </div>
  </div>`;
}

/* ---------- dano ---------- */
function cbDanoCalc(e, dano){
  const bruto = dano.valor===''? 0 : Math.max(0, Number(dano.valor)||0);
  const arm = e.tipo==='pc'? armaduraTotal(e.ficha) : (Number(e.ficha.arm)||0);
  const usa = dano.pa? 0 : arm;
  return {bruto, arm, usa, liq: Math.max(0, bruto-usa)};
}
function cbDanoTexto(e, dn){
  if(dn.valor==='') return 'Informe o dano rolado.';
  const c = cbDanoCalc(e, dn);
  if(c.bruto===0) return 'Sem dano.';
  let t = `${c.bruto} − Armadura ${c.usa} = <b>${c.liq}</b> de dano`;
  if(e.tipo==='pc'){ const f = e.ficha; if(c.liq > 2*f.pcMax) t += ' · maior que o dobro dos PC máx.: <b>Trauma automático</b>'; else if(c.liq>=f.pc && f.pc>0) t += ' · leva a 0 PC: Ferida e Tabela de Ferimentos'; }
  return t;
}
function DanoModalHTML(){
  const dn = state.cbDano, e = cbPorId(dn.id); if(!e) return '';
  const c = cbDanoCalc(e, dn);
  return `<div class="modal-bg"><div class="modal" style="max-width:380px;">
    <h3 style="font-family:var(--serif);font-size:1.3rem;margin:0 0 4px;">Receber dano</h3>
    <p class="muted" style="margin:0 0 12px;font-size:.88rem;">${esc(cbNome(e))} · Armadura ${c.arm}</p>
    <input id="cbDanoIn" type="number" min="0" inputmode="numeric" placeholder="Dano rolado" value="${esc(dn.valor)}" oninput="App.cbDanoValor(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();App.cbAplicarDano();}" style="width:100%;padding:12px;font-size:1.3rem;text-align:center;border-radius:8px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" autofocus>
    <label class="row" style="gap:8px;margin-top:12px;"><input type="checkbox" ${dn.pa?'checked':''} onchange="App.cbDanoPA(this.checked)"> Ignora a Armadura (dano mágico, defesa com 20, Vulto, Mangual…)</label>
    <p id="cbDanoTxt" style="margin:14px 0 0;color:var(--hope);">${cbDanoTexto(e, dn)}</p>
    <div class="row" style="justify-content:flex-end;margin-top:16px;"><button class="btn btn-ghost" onclick="App.cbFecharDano()">Cancelar</button><button id="cbDanoOk" class="btn btn-gold" onclick="App.cbAplicarDano()" ${dn.valor===''?'disabled':''}>Aplicar</button></div>
  </div></div>`;
}
App.cbDanoValor = (v)=>{
  if(!state.cbDano) return; state.cbDano.valor = v;
  const e = cbPorId(state.cbDano.id); if(!e) return;
  const t = document.getElementById('cbDanoTxt'), b = document.getElementById('cbDanoOk');
  if(t) t.innerHTML = cbDanoTexto(e, state.cbDano);
  if(b) b.disabled = (v==='');
};
App.cbAplicarDano = ()=>{
  const dn = state.cbDano; if(!dn) return;
  const e = cbPorId(dn.id); if(!e){ state.cbDano = null; return render(); }
  const c = cbDanoCalc(e, dn); state.cbDano = null;
  if(e.tipo==='pc'){
    const f = getFicha(e.ficha.id); const res = aplicarDanoPC(f, c.bruto, !!dn.pa);
    salvarUmaFicha(f, true);
    registrarRolagem({id:uid(), ts:Date.now(), tipo:'texto', autor:f.nome||'Sem nome', rotulo:'Dano recebido', texto:`${res.bruto} − Armadura ${res.arm} = ${res.liq} · PC ${res.antes} → ${res.depois}. ${res.log.join(' ')}`, total:res.liq});
  } else {
    const doc = {...e.doc}; const max = Number(e.ficha.pc)||0;
    const atual = doc.pcAtual==null? max : doc.pcAtual;
    doc.pcAtual = Math.max(0, atual - c.liq);
    if(max>0 && doc.pcAtual<=0 && !(doc.cond||[]).includes('derrotado')) doc.cond = [...(doc.cond||[]), 'derrotado'];
    gravarCbt(doc);
  }
};
App.cbPip = (id, campo, n)=>{
  const e = cbPorId(id); if(!e) return;
  if(e.tipo==='pc'){ if(!cbPodeVer(e)) return; App.ppPip(e.ficha.id, 'pc', n); return; }
  if(!ehMestreAtual()) return;
  const doc = {...e.doc}; doc.pcAtual = n; if(n>0) doc.cond = (doc.cond||[]).filter(k=>k!=='derrotado'); else if(!(doc.cond||[]).includes('derrotado')) doc.cond = [...(doc.cond||[]), 'derrotado'];
  gravarCbt(doc);
};

function TableBody(ehMestre){

  if(t==='dados') return TabDados();

}

const rolarLista = (lista)=>{ const n = d(lista.length); return {n, t:lista[n-1]}; };
const rolarFaixa = (tab)=>{ const n = d(6)+d(6); return {n, t:tab.find(x=>n<=x.ate).t}; };
function expDado(s){ const m = String(s).match(/^(\d*)d(\d+)(?:\+(\d+))?\s+(.*)$/); if(!m) return {txt:s}; const q = Number(m[1])||1, l = Number(m[2]), b = Number(m[3])||0; const ds = rolarVarios(q,l), tot = soma(ds)+b; return {txt:`${tot}× ${m[4]}`, qtd:tot, nome:m[4], dados:ds}; }
const TAB_ROLLS = {
  clima:()=>{ const r = rolarFaixa(CLIMA_2D6); return {titulo:'Clima (2d6)', linhas:[`${r.n}: ${r.t}`]}; },

  tesouro:()=>{ const r = rolarLista(TESOURO); const t = r.t; return {titulo:'Tesouro (d20)', linhas:[`${r.n}. ${t.nome} — ${t.pp} pp${t.slots? ' · ocupa '+t.slots+' espaço(s)':''}`]}; },
  eca:()=>{ const r = rolarLista(TABELAS_MJ.eca.itens); return {titulo:'Eca! O que é isso? (d20)', linhas:[`${r.n}. ${r.t}`]}; },

  fada:()=>{ const a = rolarLista(TABELAS_MJ.povoFada.itens), b = rolarLista(TABELAS_MJ.nomeFada.itens); return {titulo:'Do povo fada', linhas:[`${a.t} chamado(a) ${b.t}.`]}; },

  feitico:()=>{ const r = rolarLista(FEITICOS); return {titulo:'Feitiço (d20)', linhas:[`${r.n}. ${r.t.nome} (${r.t.alcance}${r.t.salv?' · Salv. '+r.t.salv:''}) — ${r.t.texto}`]}; },
  maravilhoso:()=>{ const r = rolarLista(ITENS_MARAVILHOSOS); return {titulo:'Item maravilhoso (d10)', linhas:[`${r.n}. ${r.t.nome} — ${r.t.texto}`]}; },
  pocao:()=>{ const r = rolarLista(POCOES); return {titulo:'Poção (d6)', linhas:[`${r.n}. ${r.t.nome} — ${r.t.texto}`, `Cura comum: ${POCAO_CURA.comum.formula} PC · premium: ${POCAO_CURA.premium.formula} PC.`]}; },

  encantada:()=>{ const r = rolarLista(ARMAS_ENCANTADAS); return {titulo:'Arma encantada (d6)', linhas:[`${r.n}. ${r.t.nome} (${r.t.dano}) — ${r.t.texto}`]}; },
  reliquia:()=>{ const a = rolarLista(RELIQUIA_FORMA), b = rolarLista(FEITICOS), c = rolarLista(RELIQUIA_RECARGA); const dd = d(2); return {titulo:'Relíquia inventada', linhas:[`${a.t} que lança ${b.t.nome} (${dd} DD).`, `Recarrega quando você: ${c.t}`]}; },

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
(async function init(){
  if(!firebaseConfigurado()){
    state.screen = 'config-firebase';
    render();
    return;
  }
  render(); // mostra a tela de login enquanto o Firebase resolve a sessão salva
  authFB.onAuthStateChanged(async (user)=>{
    if(user){
      const nomeExibicao = user.displayName || user.email;
      const u = await DB.get(K.user(nomeExibicao));
      state.usuario = u || {nome:nomeExibicao, uid:user.uid, email:user.email, criado:Date.now(), campanhas:[]};
      if(state.screen==='login') state.screen='home';
      if(state.screen==='home') await recarregarCampanhasHome();
      // depois de um refresh, volta direto para a mesa que estava aberta
      if(state.screen==='home' && !state.campanha){
        try{
          const ult = JSON.parse(localStorage.getItem('pp:ultimaMesa')||'null');
          if(ult && ult.u===state.usuario.nome && (state.usuario.campanhas||[]).includes(ult.cod)) await App.abrirMesa(ult.cod);
        }catch(e){}
      }
    } else {
      state.usuario = null;
      if(state.screen!=='config-firebase') state.screen = 'login';
    }
    render();
  });
})();
</script>
